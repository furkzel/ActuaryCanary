id: MT11
version: 1.2.0
title_en: Over-dispersed Poisson bootstrap
title_tr: Aşırı yayılımlı Poisson bootstrap
status: reviewed
implemented: true
definition: >-
  The full predictive distribution of the chain-ladder reserve under the over-dispersed
  Poisson model (England and Verrall 1999, 2002): residual resampling for parameter error
  and gamma draws for process error give simulated reserves per origin and in total, with
  percentiles, value at risk, tail value at risk and simulated cash flows by calendar period.
tier: B
requires:
  - claim_valuations.claim_id
  - claim_valuations.valuation_date
  - claim_valuations.paid_to_date
optional: [claims.occurrence_date, claims.segment, claims.line]
uses: [MT01, MT02, MT14, MT06]
assumptions:
  - statement: >-
      Incremental paid amounts are independent with mean m(i) r(j) and variance phi times the
      mean (row and column effects, one scale parameter); the chain ladder gives the same
      reserve as this model.
    check: >-
      Unscaled Pearson residuals show no trend against origin, development, calendar
      diagonal or fitted value; their spread is similar across columns (otherwise use the
      column-wise scale option).
  - statement: >-
      Every column of incremental paid up to the last column with a positive sum sums to a
      positive amount. The trailing columns whose sum is zero or less (fully developed late
      columns of a short-tail line, with zero increments or small recoveries) carry no
      development: the model is fitted and simulated on the triangle cut after the last column
      with a positive sum, and the cut columns have chain-ladder factors of 1.
    check: >-
      Column sums of the incremental triangle; a non-positive column that is not part of the
      trailing block stops the method; the trailing block is cut and reported (columns_cut,
      cut_columns); the reserve of the cut triangle against the chain-ladder reserve of the
      whole triangle (cut_reserve_difference).
  - statement: >-
      Residuals are exchangeable across cells and have mean zero after centring (parameter
      centre_residuals).
    check: Residual plots by development period; a few columns with much larger residuals suggest heteroscedasticity.
parameters:
  - name: n_simulations
    default: 10000
    description: Number of bootstrap samples; 10,000 gives the 99.5th percentile from 50 tail values.
  - name: seed
    default: run seed
    description: Seed of the random generator, recorded in the manifest (blueprint 12).
  - name: process_distribution
    default: gamma
    description: Distribution of process error; gamma with mean m and variance phi m, or over-dispersed Poisson (phi times a Poisson with mean m / phi).
    allowed: [gamma, odp]
  - name: scale
    default: constant
    description: One scale parameter for the triangle, or one per development period (heteroscedastic adjustment).
    allowed: [constant, by_development]
  - name: tail_factor
    default: MT02 tail_factor
    description: Tail of the fitted chain ladder; a tail from MT14 adds a fixed share to each simulation, without its own error.
  - name: centre_residuals
    default: true
    description: The pool of adjusted residuals has its mean subtracted before resampling, as the reference package does (decision 0612).
  - name: percentiles
    default: [0.5, 0.75, 0.9, 0.95, 0.99, 0.995]
    description: Percentiles reported, as in MT06.
  - name: var_level
    default: 0.995
    description: Value-at-risk level, as in MT06.
  - name: tvar_level
    default: 0.99
    description: Tail value-at-risk level, as in MT06.
algorithm:
  - step: >-
      Cut of the trailing columns. With S_j the sum of incremental paid over the observed cells
      of development column j, let J* be the last column with S_j above zero. The columns
      J*+1 .. J-1 are cut when all of them have S_j of zero or less: the triangle used by every
      later step has the columns 0 .. J*, origins keep their rows, and an origin observed in
      the cut columns is treated as observed up to column J* (its cumulative paid at J* is its
      latest). The cut columns carry no simulated development, their chain-ladder factors are 1,
      and the simulated reserve is the chain-ladder reserve of the cut triangle. A column j <= J*
      with S_j of zero or less is not part of the trailing block and stops the method (failure
      modes). The method also fits the volume-weighted chain ladder of the whole triangle and
      reports the difference between the two reserves; the two are equal when the factors beyond
      the cut are 1.
    formula: 'S_j = \sum_i X_{i,j}, \qquad J^{*} = \max\{ j : S_j > 0 \}, \qquad \Delta = \sum_i \hat R^{\mathrm{cut}}_i - \sum_i \hat R^{\mathrm{full}}_i'
  - step: >-
      Paid triangle from MT01 (cumulative C and incremental X, origins i = 0..I-1, columns
      j = 0..J-1), cut as above, so that J is the number of columns kept from here on. Fit the volume-weighted chain ladder over all diagonals (MT02) and the
      fitted cumulative cells by backward recursion from the latest diagonal.
    formula: '\hat m_{i,J_i} = C_{i,J_i}, \qquad \hat m_{i,j} = \hat m_{i,j+1} / f_j \ (j < J_i), \qquad \hat\mu_{i,j} = \hat m_{i,j} - \hat m_{i,j-1}'
  - step: Unscaled Pearson residuals and the scale parameter.
    formula: 'r_{i,j} = \frac{X_{i,j} - \hat\mu_{i,j}}{\sqrt{\hat\mu_{i,j}}}, \qquad \hat\phi = \frac{\sum r_{i,j}^2}{n - p}, \quad p = I + J - 1'
  - step: >-
      Bias adjustment of the residuals; the cells fitted exactly (the single cell of the
      first column of the latest origin and of the last column of the oldest origin) have
      zero residual and leave the resampling pool. With scale by_development, phi and the
      residuals are computed per column and residuals are rescaled to a common variance.
      With centre_residuals the mean of the pool is subtracted from every adjusted residual.
    formula: 'r^{\mathrm{adj}}_{i,j} = r_{i,j} \sqrt{\frac{n}{n - p}}, \qquad r^{\mathrm{c}}_{i,j} = r^{\mathrm{adj}}_{i,j} - \bar r^{\mathrm{adj}}'
  - step: For each simulation b, resample residuals with replacement and form a pseudo-triangle.
    formula: 'X^{*}_{i,j} = \hat\mu_{i,j} + r^{*}_{i,j} \sqrt{\hat\mu_{i,j}}'
  - step: >-
      Refit the chain ladder on the cumulated pseudo-triangle, giving f*(j), and project the
      future incremental means of each origin from the cumulative of the pseudo-triangle on
      its latest diagonal, C*(i, J_i), not from the actual latest cumulative: this is the
      forecast of the refitted model, whose row parameters are re-estimated on the pseudo-data
      (decision 0612).
    formula: '\mu^{*}_{i,k} = C^{*}_{i,J_i} \Big(\prod_{l=J_i}^{k-1} f^*_l\Big)\,\big(f^*_{k} - 1\big), \quad k \ge J_i'
  - step: >-
      Process error: draw every future increment from the process distribution, in the gamma
      form of the benchmark script (decision 0609); a negative mean is drawn with its absolute
      value and the sign restored. The simulated reserve is the sum of the draws.
    formula: 'Y^{*}_{i,k} \sim \Gamma\big(\mathrm{shape} = |\mu^*_{i,k}| / \hat\phi,\ \mathrm{scale} = \hat\phi\big)\, \mathrm{sign}(\mu^*_{i,k}), \qquad R^{*}_{b} = \sum_{i}\sum_{k \ge J_i} Y^{*}_{i,k}'
  - step: Summary statistics over the simulations, per origin and in total.
    formula: 'q_p = \mathrm{quantile}_p\{R^*_b\}, \quad \mathrm{VaR}_p = q_p, \quad \mathrm{TVaR}_p = \mathrm{mean}\{R^*_b : R^*_b \ge q_p\}, \quad cv = sd / \mathrm{mean}'
  - step: >-
      Simulated cash flows: each Y*(i, k) is assigned to the calendar period of origin i and
      development k (CV04), so that every simulation has a cash-flow vector for discounting
      (CV10, RS04) and the one-year view.
outputs:
  - name: reserve_distribution
    description: Simulated reserves per origin and in total (kept as a parquet file in the run folder).
  - name: summary
    description: Mean, standard deviation, coefficient of variation, percentiles, VaR and TVaR per origin and in total.
  - name: simulated_cash_flows
    description: Mean and percentiles of future payments by calendar period.
  - name: residuals
    description: Unscaled and adjusted Pearson residuals with origin, development and calendar diagonal.
  - name: scale_parameter
    description: phi, constant or per development period.
  - name: columns_cut
    description: Number of trailing development columns cut (0 when none).
  - name: cut_columns
    description: The development columns that were cut, by index and age.
  - name: cut_reserve_difference
    description: >-
      Chain-ladder reserve of the cut triangle minus that of the whole triangle (MT02,
      volume-weighted, all diagonals, tail 1), total and as a share of the whole-triangle
      reserve; written only when columns were cut.
diagnostics:
  - Residuals against origin, development, calendar diagonal and fitted value, with mean per group.
  - Mean of the simulated reserve against the chain-ladder reserve (bias of the bootstrap).
  - Comparison of the bootstrap range with the Mack lognormal range of MT06.
  - Histogram of the simulated total reserve.
failure_modes:
  - condition: Chain ladder not available (MT02 failure) or fewer than 5 origin periods.
    action: Not run; reason "the bootstrap needs a chain ladder on at least 5 origin periods".
  - condition: >-
      A column of incremental paid sums to zero or less and it is not part of the trailing block
      (a column with a positive sum comes after it), or, after the cut, a fitted increment is
      not positive, or no column has a positive sum.
    action: Not run; reason names the column. The user may start the triangle later or merge columns.
  - condition: >-
      The last columns of the triangle sum to zero or less (the trailing block).
    action: >-
      Run on the cut triangle; the cut (number of columns, which) is part of the output. After
      the cut the other conditions apply to the cut triangle (at least 5 origin periods, n - p
      above 2, a positive fitted increment in every kept cell).
  - condition: >-
      The reserve of the cut triangle differs from the chain-ladder reserve of the whole triangle
      by more than 1 per cent of the latter.
    action: Run, with a WARNING giving the difference and the share.
  - condition: n - p is 2 or less.
    action: Not run; reason "too few cells to estimate the scale parameter".
  - condition: More than 1 per cent of simulations have a negative total reserve.
    action: Run, with a WARNING giving the share.
validation:
  - kind: fixture
    description: >-
      A 4 x 4 incremental triangle: fitted values, unscaled residuals, phi, the bias
      adjustment and the zero-residual cells hand-computed.
    tolerance: 1e-12 relative
  - kind: fixture
    description: >-
      Two 5 x 5 incremental triangles for the cut. (a) The last column is zero for every origin
      that has it (the cumulative paid of the oldest origin does not move in the last column):
      one column cut, the fitted values, unscaled residuals, phi (n = 14, p = 8) and the pool of
      the 5 x 4 cut triangle hand-computed, the reserve difference zero. (b) The last two columns
      sum to a negative amount (each of them to less than zero): two columns cut, the fitted
      values, residuals and phi (n = 12, p = 7) of the 5 x 3 cut triangle hand-computed, and the
      reserve difference against the chain ladder of the whole triangle (its factors beyond the
      cut are below 1) hand-computed.
    tolerance: 1e-12 relative
  - kind: property
    description: >-
      Same seed, same output; row order of the input does not matter; multiplying the
      triangle by a constant multiplies every simulated reserve by that constant (gamma
      process).
    tolerance: 1e-9 relative
  - kind: property
    description: >-
      Appending a development column whose increments are all zero (or one with no observed
      cell) to a triangle changes no simulated number: same seed, same reserves and cash flows,
      same phi. A non-positive column inside the triangle (a positive column after it) still
      stops the method, with the column named.
    tolerance: exact
  - kind: benchmark
    description: >-
      On GenIns and RAA with 10,000 simulations: the scale parameter phi against its frozen
      value, and the mean total reserve against the chain-ladder reserve. The reference
      resamples with the chainladder package's BootstrapODPSample, applies the adjustment
      sqrt(n / (n - p)) of this spec on top of the package output (the package does not apply
      it with hat_adj=False), fits the package's chain ladder on each pseudo-triangle alone
      and adds the gamma process error above; frozen in tests/benchmarks as in decision 0007.
      The reference is therefore not independent of this spec. The median, percentiles and
      standard deviation of the reference are information, not pass criteria (decision 0282).
    tolerance: scale parameter 1e-9 relative; mean within 5 per cent of the chain-ladder reserve (decision 0282)
  - kind: ground_truth
    description: >-
      Calibration on triangles drawn from the model itself: row and column parameters and
      phi fitted to GenIns, incremental cells drawn from the gamma process, at least 1,000
      triangles with 2,000 simulations each, fixed seed. The true total reserve of each
      triangle falls below the bootstrap 95th percentile (slow test, behind
      ACTUARYCANARY_MONTE_CARLO=1).
    tolerance: coverage within 90 to 99 per cent
  - kind: ground_truth
    description: >-
      Calibration on a short-tail model: the same model with the development pattern of the
      first six columns of GenIns, renormalised to add to one, and the later columns exactly
      zero in the model (so every triangle drawn has zero increments in its last four columns
      and the method cuts them). At least 1,000 triangles with 2,000 simulations each, fixed
      seed; the true reserve of each triangle falls below the bootstrap 95th percentile (slow
      test, behind ACTUARYCANARY_MONTE_CARLO=1). A smaller size may be run if the specified one
      is too heavy for the machine; the size run is stated with the result.
    tolerance: coverage within 90 to 99 per cent
  - kind: ground_truth
    description: >-
      Coverage of the 95th percentile per line on repeated synthetic baseline simulations,
      beside MT06's coverage, reported as information (slow test, behind
      ACTUARYCANARY_MONTE_CARLO=1). Calendar-year inflation breaks the independence the
      model assumes, as for Mack (decision 0062).
    tolerance: none; information only
references:
  - England, P. D. and Verrall, R. J. (1999). Analytic and bootstrap estimates of prediction errors in claims reserving. Insurance Mathematics and Economics.
  - England, P. D. and Verrall, R. J. (2002). Stochastic claims reserving in general insurance. British Actuarial Journal.
  - England, P. D. (2002). Addendum to "Analytic and bootstrap estimates of prediction errors in claims reserving". Insurance Mathematics and Economics.
notes: >-
  The bootstrap replaces neither MT06 nor RS03; M12 shows both ranges side by side. Paid
  only: an incurred bootstrap has negative increments too often for the model. The cut of
  trailing columns (1.2.0) lets the method run on short-tail lines, whose late columns are
  fully developed; the cut is reported with the output and in M12.
change_log:
  - version: 0.1.0
    date: 2026-10-23
    change: First draft from blueprint section 9.2 (P20).
  - version: 0.2.0
    date: 2026-10-24
    change: Acceptance statistics are the median, 75th and 95th percentile of the reserve distribution; the standard deviation is reported and compared only with its wide Monte Carlo tolerance; process error in the gamma form of the benchmark script (decision 0609).
  - version: 0.3.0
    date: 2026-10-25
    change: Future means are projected from the pseudo-triangle's own latest diagonal; new parameter centre_residuals (default true); the mean criterion of the benchmark is 3 per cent (decision 0612).
  - version: 1.0.0
    date: 2026-10-25
    change: Reviewed and accepted by the owner.
  - version: 1.1.0
    date: 2026-10-25
    change: >-
      Benchmark pass criteria are the scale parameter and the mean within 5 per cent of the
      chain-ladder reserve; percentiles and the standard deviation of the re-frozen reference
      are information, because the package applies no degrees-of-freedom adjustment and mixed
      the simulations when fitted as one batch (owner decision, decision 0282). The algorithm
      is unchanged.
  - version: 1.2.0
    date: 2026-11-09
    change: >-
      Trailing development columns whose incremental paid sums to zero or less are cut: the model
      is fitted and simulated on the triangle cut after the last column with a positive sum
      (assumption text, failure modes, a first algorithm step, the outputs columns_cut, cut_columns
      and cut_reserve_difference, two 5 x 5 fixtures, a property test and a calibration on a
      short-tail model). A non-positive column inside the triangle still stops the method. Numbers
      for triangles without a trailing non-positive column are unchanged (decision 0349). The owner
      has not reviewed this version.
