id: MT22
version: 1.0.0
title_en: Back-testing of past selections
title_tr: Geçmiş seçimlerin geriye dönük testi
status: reviewed
implemented: false
definition: >-
  Measures how good earlier reserve estimates were: the methods and selections are re-run
  as at earlier cut-offs with only the facts known then (CV04 as-of rule), and their
  ultimates are compared with today's estimate and, for mature origins, with the developed
  actual, by method and by horizon.
tier: B
requires:
  - claim_valuations.claim_id
  - claim_valuations.valuation_date
  - claim_valuations.paid_to_date
  - claim_valuations.case_reserve
optional: [claims.occurrence_date, claims.segment, claims.line, premiums.amount, policies.start_date]
uses: [MT02, MT03, MT04, MT05, MT06, MT10, MT11, MT12, MT13, AE01, CV04]
assumptions:
  - statement: Today's estimate of a mature origin is close to its final cost.
    check: Only origins whose maturity (MT10) is at least mature_at count as the actual; the rest compare with today's estimate, labelled.
  - statement: The past cut-offs see the data as it was then.
    check: As-of rebuild (CV04) uses valuation_date and booking dates; later corrections of old rows are not visible in the input and are a stated limitation.
parameters:
  - name: horizons_months
    default: [12, 24, 36]
    description: How far back the earlier cut-offs lie.
  - name: methods
    default: [MT02, MT03, MT04, MT05, MT10]
    description: Methods back-tested; any tier B or C method that ran may be added.
  - name: mature_at
    default: 0.95
    description: Reported share from which today's estimate stands for the actual.
  - name: backtest_simulations
    default: 1000
    description: >-
      Number of simulations of the reruns of MT06 and MT11 at past cut-offs, so that
      back-testing stays inside the time budget. The bootstrap rerun is optional.
  - name: past_selections
    default: rerun
    description: Re-run the default selection rules at the past cut-off, or read the selections of past run manifests in the folder when present.
    allowed: [rerun, manifests]
algorithm:
  - step: For each horizon h, the cut-off c - h; every triangle, method and selection re-run on facts known at c - h (CV04).
  - step: Error of each method per origin, against today's selected ultimate or, for mature origins, the actual (the error measure AE02).
    formula: 'e_{m,i}(h) = \frac{\hat U_{m,i}(c - h) - U^{\mathrm{ref}}_i(c)}{U^{\mathrm{ref}}_i(c)}'
  - step: Summary per method, horizon and line - bias, mean absolute error and root mean square error, weighted by the reference ultimate.
    formula: 'B_m(h) = \frac{\sum_i w_i e_{m,i}}{\sum_i w_i}, \quad MAE_m(h) = \frac{\sum_i w_i |e_{m,i}|}{\sum_i w_i}, \quad w_i = U^{\mathrm{ref}}_i(c)'
  - step: >-
      Range calibration - share of origins whose reference falls inside the past 5 to 95 per
      cent range of MT06 (and MT11 when run, an optional rerun with backtest_simulations samples); the expected share is 90 per cent.
  - step: Actual against expected development over each horizon (AE01) beside the errors.
outputs:
  - name: back_test_errors
    description: e(m, i, h) per method, origin and horizon.
  - name: summary
    description: Bias, MAE and RMSE per method, horizon and line.
  - name: range_calibration
    description: Share of references inside the past ranges per method and horizon.
diagnostics:
  - Error by method against origin maturity at the past cut-off.
  - Run-off of the selected ultimate of each origin across past cut-offs.
failure_modes:
  - condition: Fewer than 3 origins with a reference at a horizon.
    action: That horizon is not summarised; reason gives the count.
  - condition: A method did not run at the past cut-off.
    action: Its errors are missing for that horizon, with the method's reason.
validation:
  - kind: fixture
    description: Four origins at two cut-offs with known ultimates; errors, bias, MAE and RMSE hand-computed.
    tolerance: 1e-12 relative
  - kind: property
    description: >-
      The re-run at cut-off c - h equals a run on the input truncated to facts known at
      c - h, bit for bit (same outputs and fingerprints, blueprint 12).
    tolerance: exact
  - kind: ground_truth
    description: >-
      On the synthetic baseline and reserve_bias_change scenarios (medium), the back-test
      bias of each method at 12 and 24 months, measured against the simulated true
      ultimates, reported as information; the reserve_bias_change scenario shows the
      incurred chain ladder's bias after the reserving change.
    tolerance: none; information only
references:
  - Friedland, J. Estimating Unpaid Claims Using Basic Techniques. Casualty Actuarial Society, chapter 15.
  - Wüthrich, M. V. and Merz, M. (2008). Stochastic Claims Reserving Methods in Insurance. Wiley.
change_log:
  - version: 0.1.0
    date: 2026-10-23
    change: First draft from blueprint section 9.2 (P20).
  - version: 0.2.0
    date: 2026-10-25
    change: New parameter backtest_simulations (default 1000) for the reruns of MT06 and MT11; the bootstrap rerun is optional (decision 0618).
  - version: 1.0.0
    date: 2026-10-25
    change: Reviewed and accepted by the owner.
