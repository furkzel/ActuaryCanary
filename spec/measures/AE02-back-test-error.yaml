id: AE02
version: 0.2.0
title_en: Back-test error of a projection
title_tr: Projeksiyonun geriye dönük test hatası
status: draft
implemented: false
definition: >-
  How far an ultimate projected at an earlier cut-off lies from the reference today (the
  selected ultimate, or the developed actual of mature origins), as a share of the
  reference, per method and horizon; used for past selections (MT22) and for every
  challenger beside its champion (blueprint 9.3).
unit: ratio
formula: 'e_{m,i}(h) = \frac{\hat U_{m,i}(c - h) - U^{\mathrm{ref}}_i(c)}{U^{\mathrm{ref}}_i(c)}, \qquad B_m(h) = \frac{\sum_i w_i\, e_{m,i}(h)}{\sum_i w_i}, \qquad MAE_m(h) = \frac{\sum_i w_i\, |e_{m,i}(h)|}{\sum_i w_i}, \qquad w_i = U^{\mathrm{ref}}_i(c)'
numerator: Projected ultimate of method m for origin i at cut-off c - h, minus the reference.
denominator: Reference ultimate of origin i at cut-off c (MT22).
grain: method, origin period and horizon; summarised per method and horizon
breakdowns: [segment, line, method, horizon, origin_period]
bases:
  reinsurance: [GROSS, NET]
  currency: [REPORTING]
  value: [NOMINAL]
requires:
  - claim_valuations.claim_id
  - claim_valuations.valuation_date
  - claim_valuations.paid_to_date
  - claim_valuations.case_reserve
optional: [claims.occurrence_date, claims.segment, claims.line]
uses: [MT22, MT10]
edge_cases:
  - case: Reference zero
    handling: Not computed for that origin.
  - case: Origin not yet mature at c
    handling: Compared with today's selected ultimate and labelled "against today's estimate".
  - case: Method did not run at c - h
    handling: Missing, with the method's reason.
  - case: Horizon not on the development grid of the cut-off
    handling: That horizon is not computed; horizons must be whole development periods (CV04).
interpretation: >-
  The bias (mean signed error) says whether a method tends to over- or under-estimate; the
  mean absolute error says how far off it usually is. A challenger earns attention only
  with a lower error than its champion over several horizons.
typical_range:
  low: -0.2
  high: 0.2
  note: Errors at 12 months are commonly within 10 per cent for mature short-tailed lines.
test:
  path: tests/measures/test_ae02_back_test_error.py
  proves: Projected 110 and 95 against references 100 and 100 give errors 0.10 and -0.05 and an MAE of 0.075.
change_log:
  - version: 0.1.0
    date: 2026-10-23
    change: First draft for modules M12 and M13 (P20).
  - version: 0.2.0
    date: 2026-10-25
    change: Weighted bias B_m(h) beside the MAE (decision 0618).
