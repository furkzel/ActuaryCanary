id: RS05
version: 1.1.0
title_en: Simulated reserve distribution and risk measures
title_tr: Simüle edilmiş karşılık dağılımı ve risk ölçüleri
status: reviewed
definition: >-
  Mean, standard deviation, coefficient of variation, percentiles, value at risk and tail
  value at risk of the reserve from the bootstrap simulations (MT11), per origin and in
  total, beside the Mack approximation of RS03.
unit: amount
formula: 'q_p = \mathrm{quantile}_p\{R^*_b\}, \quad \mathrm{VaR}_p = q_p, \quad \mathrm{TVaR}_p = \mathrm{mean}\{R^*_b : R^*_b \ge q_p\}, \quad cv = \mathrm{sd}\{R^*_b\} / \mathrm{mean}\{R^*_b\}'
numerator: Simulated reserves R*(b) of MT11, per origin and in total; discounted per simulation on the DISCOUNTED basis (CV10).
denominator: null
grain: origin period and total, by segment and line
breakdowns: [segment, line, entity, origin_period]
bases:
  reinsurance: [GROSS, NET]
  currency: [REPORTING]
  value: [NOMINAL, DISCOUNTED]
requires:
  - claim_valuations.claim_id
  - claim_valuations.valuation_date
  - claim_valuations.paid_to_date
optional: [claims.occurrence_date, claims.segment, claims.line, interest_rates.curve_id]
uses: [MT11, RS03, CV10]
parameters:
  - name: line_correlation
    default: 0
    description: >-
      Correlation between the reserves of two lines when the lines are added to an all-lines
      total (a constant correlation between every pair of lines, between 0 and 1). The default
      0 is independence; the value in force is a row of the assumptions register. The
      simulations add by a Gaussian rank reordering of the lines with this correlation; the
      Mack lognormal adds the standard errors with it (RS03).
  - name: var_level
    default: 0.995
    description: Value-at-risk level, as in MT06 and MT11.
  - name: tvar_level
    default: 0.99
    description: Tail value-at-risk level, as in MT06 and MT11.
edge_cases:
  - case: MT11 did not run
    handling: Not available, with MT11's reason; RS03 is still shown.
  - case: Selected reserve differs from the chain-ladder reserve
    handling: The simulated distribution is shifted multiplicatively to the selected mean and labelled "bootstrap CV applied to the selected reserve", as RS03 does.
  - case: Negative simulated totals
    handling: Kept in the distribution; their share is noted.
  - case: Estimator of the tail value at risk from a finite sample
    handling: >-
      The mean of the simulated values at or above the empirical quantile at the tail level
      (linear interpolation between the two nearest order statistics). With n simulations
      about n (1 - level) values enter; the output states the estimator, n and the number of
      values used. The closed form of RS03 (lognormal) is exact; the two differ by sampling
      error.
  - case: All lines together
    handling: >-
      Simulation b of every line is added (the lines are simulated from independent streams,
      so the sum is of independent reserves) after the rank reordering of line_correlation;
      the lines need the same number of simulations. When the bootstrap did not run for a line
      there is no simulated total of all lines, and the output names the lines without one.
  - case: DISCOUNTED basis
    handling: >-
      Discounted per simulation from the simulated cash flows of MT11 by calendar period
      (CV10), so it exists for a line as a whole and for all lines; MT11 keeps no cash flows
      by origin, so an origin has its expected discounted unpaid (RS04) and no discounted
      distribution. The distribution is scaled with the same ratio as the nominal one.
  - case: Origin with no future cash flow (fully developed)
    handling: Its simulated reserve is zero in every simulation and it is shown as such.
interpretation: >-
  The bootstrap range includes parameter and process error and is usually wider than the
  Mack lognormal range on lines with calendar effects; VaR and TVaR are indicative, not
  capital requirements.
typical_range:
  low: null
  high: null
  note: Total coefficient of variation commonly 5 to 25 per cent for non-life lines.
test:
  path: tests/measures/test_rs05_simulated_reserve_distribution.py
  proves: Ten given simulated reserves give the hand-computed empirical percentiles, VaR and TVaR.
change_log:
