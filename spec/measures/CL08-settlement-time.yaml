id: CL08
version: 0.1.0
title_en: Settlement time
title_tr: Hasar sonuçlanma süresi
status: draft
definition: >-
  Days from report to closing for closed claims, and a product-limit survival curve of
  time to closing in which open claims are censored at the cut-off.
unit: days
formula: 'T_k = \mathrm{close}_k - \mathrm{report}_k; \qquad \hat S(t) = \prod_{t_m \le t} \Big(1 - \frac{d_m}{n_m}\Big)'
numerator: >-
  Settlement days of claims closed by the cut-off. In the survival curve, d_m is the number
  of closings at duration t_m and n_m the number of claims still open just before t_m;
  claims open at the cut-off contribute their duration c - report as censored.
denominator: Number of closed claims (for the mean and percentiles).
grain: claim; summarised by report period, segment and line
breakdowns: [segment, line, entity, product, partner, cause, origin_period, claim_size_class]
bases:
  reinsurance: [GROSS]
  currency: [ORIGINAL]
  value: [NOMINAL]
requires:
  - claims.claim_id
  - claims.report_date
  - claim_valuations.claim_id
  - claim_valuations.valuation_date
  - claim_valuations.status
optional: [claims.close_date, claims.segment, claims.line]
uses: [CL04, CV04, CV08]
parameters:
  - name: percentiles
    default: [0.5, 0.75, 0.9]
    description: Percentiles of the survival curve shown as settlement-time quantiles.
edge_cases:
  - case: close_date empty or claims has no close_date column
    handling: >-
      The close date is the valuation date of the last transition into a closed status
      (CV04); its precision is one month and it is labelled as derived.
  - case: Reopened and closed again
    handling: The last closing counts; a claim open at the cut-off is censored whatever its history.
  - case: close_date before report_date (DV-CLM-05)
    handling: Excluded.
  - case: Survival curve never reaches a percentile
    handling: That percentile is shown as "beyond observed range".
interpretation: >-
  Speed of claims handling. The mean of closed claims alone is biased low for young
  periods; the survival curve corrects that by using open claims as censored observations.
typical_range:
  low: 0
  high: 1500
  note: Median days; motor own damage 30 to 90, liability often over a year.
test:
  path: tests/measures/test_cl08_settlement_time.py
  proves: >-
    Four closed and two open claims give the hand-computed mean of closed claims and the
    product-limit curve at each closing duration; a claim without close_date uses its
    month of closing.
change_log:
  - version: 0.1.0
    date: 2026-10-20
    change: First draft from blueprint section 8.1.
