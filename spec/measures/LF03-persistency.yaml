id: LF03
version: 0.1.0
title_en: Persistency
title_tr: Sözleşme devamlılığı (persistency)
status: draft
implemented: false
definition: >-
  Share of contracts of an entry cohort still in force n years after entry, from the
  Kaplan–Meier curve so that contracts not yet n years old count as censored.
unit: ratio
formula: 'P_g(n) = \hat S_g(n) = \prod_{t_m \le n} \Big(1 - \frac{d_m}{r_m}\Big)'
numerator: >-
  Product-limit (Kaplan–Meier) survival of cohort g at n years, the estimator of MT19 on
  contracts - time from entry_date, event LAPSE, SURRENDER or TRANSFER_OUT, censored at
  other exits and at the cut-off; d(m) events among r(m) at risk at t(m).
denominator: null
grain: entry cohort (entry year) at 1, 2, 3 and 5 years
breakdowns: [segment, line, product, channel, calendar_period]
bases:
  reinsurance: [GROSS]
  currency: [ORIGINAL]
  value: [NOMINAL]
requires:
  - life_in_force.contract_id
  - life_in_force.valuation_date
  - life_in_force.entry_date
  - life_in_force.status
optional: [life_events.event_date, life_events.event_type, life_in_force.product, life_in_force.channel]
uses: [CV11]
parameters:
  - name: years
    default: [1, 2, 3, 5]
    description: Durations at which persistency is reported (13th, 25th month style).
edge_cases:
  - case: Cohort younger than n years
    handling: Shown when at least half the cohort was at risk at n; otherwise not computed.
  - case: Deaths and maturities
    handling: Censored, not counted as non-persistent.
interpretation: >-
  The share of business that stays. Falling persistency of recent cohorts at the same
  duration points at sales quality or market conditions; compare by channel.
typical_range:
  low: 0.5
  high: 1.0
  note: Thirteenth-month persistency of regular-premium products commonly 75 to 90 per cent.
test:
  path: tests/measures/test_lf03_persistency.py
  proves: A cohort of five contracts with one lapse and one censored before a year gives the hand-computed Kaplan–Meier value.
change_log:
  - version: 0.1.0
    date: 2026-10-23
    change: First draft from blueprint section 8.1 (P20).
