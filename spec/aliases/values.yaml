id: AL02
version: 1.2.0
title_en: Value aliases
title_tr: Değer eşleştirmeleri
status: reviewed
definition: >-
  Turkish and English labels, abbreviations and common misspellings for every class of
  every classified field in the data concepts.
notes: >-
  Labels are compared after the same normalisation as column aliases (normalise_label).
  The class name itself always matches. A label that matches no class becomes UNMAPPED and
  is listed (blueprint 6.4); it is never dropped or guessed. Seed list; extended as real
  data is confirmed.
