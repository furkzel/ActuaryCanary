id: AL04
version: 0.1.0
title_en: Value aliases of planned concepts
title_tr: Planlanan kavramların değer eşleştirmeleri
status: draft
implemented: false
definition: >-
  Turkish and English labels for every class of every classified field of the data concepts
  planned for a later version.
notes: >-
  Same rules as AL02; the loader checks AL02 and AL04 together. Kept apart so that AL02 and
  the run id do not change before a concept is built; the item that builds a concept moves
  its entries into AL02 (decision 0200).
