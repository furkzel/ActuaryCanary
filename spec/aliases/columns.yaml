id: AL01
version: 1.0.0
title_en: Column aliases
title_tr: Sütun adı eşleştirmeleri
status: reviewed
definition: >-
  Turkish and English column names, abbreviations and common misspellings for every field
  of every data concept, plus names of personal-data columns that are dropped on load.
notes: >-
  Labels are compared after normalisation (blueprint 6.3 layer 1, normalise_label): Turkish
  letters folded, accents, punctuation and spaces removed, so ÖDEME TARİHİ, Odeme_Tarihi and
  ODEMETARIHI are one token and need not all be listed. Each entry names the concepts it
  applies to; within a concept a token may point at one field only. The canonical field
  name always matches its own field. Seed list; extended as real layouts are confirmed.
