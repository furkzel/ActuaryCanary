id: AL03
version: 0.1.0
title_en: Column aliases of planned concepts
title_tr: Planlanan kavramların sütun adı eşleştirmeleri
status: draft
implemented: false
definition: >-
  Turkish and English column names for every field of the data concepts planned for a later
  version (reinsurance, recoveries, ledger, interest rates, life and pension), plus further
  personal-data columns of those feeds.
notes: >-
  Same rules as AL01 (normalise_label, one field per token within a concept, no token that
  is also personal data); the loader checks AL01 and AL03 together. Kept apart so that AL01
  and the run id do not change before a concept is built; the item that builds a concept
  moves its entries into AL01 (decision 0200).
