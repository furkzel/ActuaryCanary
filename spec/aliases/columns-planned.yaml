id: AL03
version: 0.4.0
title_en: Column aliases of planned concepts
title_tr: Planlanan kavramların sütun adı eşleştirmeleri
status: draft
implemented: false
definition: >-
  Turkish and English column names for every field of the data concepts planned for a later
  version (reinsurance, recoveries, ledger, interest rates, life and pension), plus further
  personal-data columns of those feeds.
notes: >-
  Same rules as AL01 (normalise_label, one field per token within a concept, no token that
  is also personal data); the loader checks AL01 and AL03 together. Kept apart so that AL01
  and the run id do not change before a concept is built; the item that builds a concept
  moves its entries into AL01 (decision 0200).
columns: []
personal_data: []
change_log:
  - version: 0.1.0
    date: 2026-10-23
    change: First seed for the concepts planned in P20.
  - version: 0.2.0
    date: 2026-11-07
    change: >-
      The entries of interest_rates moved to AL01 with the build of the concept (P26).
  - version: 0.3.0
    date: 2026-11-11
    change: >-
      The entries of reinsurance_treaties, reinsurance_transactions, recoveries and ledger
      moved to AL01 with the build of the concepts (F1bc); entries shared with the life
      concepts stay here for those concepts.
  - version: 0.4.0
    date: 2026-11-17
    change: >-
      The entries of life_in_force, life_events and fund_flows and the personal-data entries
      moved to AL01 with the build of the concepts (L1a, record 0440). No concept is planned
      any more; the file stays empty for the next planned concept (the generator reads it).
