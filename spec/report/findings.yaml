id: RP01
version: 1.2.1
title_en: Key finding rules
title_tr: Temel bulgu kuralları
status: draft
definition: >-
  The fixed rules that write the sentences of the report (blueprint 11, key findings and the
  findings of each page). A rule has a condition on named facts of the run, a sentence
  template whose placeholders are facts, and the evidence it links to. A sentence appears
  when its condition holds and never otherwise; no other text is generated.
notes: >-
  Scope `run` gives one sentence for the run, `segment` one per segment (segments are never
  added together), `line` one per segment and line, shown on the reserving page of that line.
  Conditions are clauses `fact op value` joined by `and`, where op is one of < <= > >= == !=
  and value is a number or another fact; a rule whose facts are not all known does not fire.
  Facts are computed from the run's results; thresholds come from the methods that own them
  (for example the thin-evidence limit of decision 0039 and the flag-rate limit of MT08), so
  a rule repeats no threshold of a method. Placeholders are formatted by the kind of their
  fact (amount, ratio, factor, count, score, text) with the rounding of CV06. Key findings
  show the run and segment sentences with the lowest priority numbers first, at most eight;
  the rest follow under "further findings". A rule with `banner` is also shown at the top of
  the cover and of every analytic page.
settings:
  # Limits that only these rules use; a condition reads a setting like any other fact.
  back_test_sign_share_limit: 0.75
  cohort_median_ratio_limit: 1.25
rules:
  - id: KF01
    title: Thin evidence
    scope: run
    priority: 0
    banner: true
    condition: thin_lines > 0
    template: >-
      Only {origin_periods} origin periods ({first_origin} to {last_origin}) are loaded for
      {thin_lines} of {lines} lines, fewer than the {thin_threshold} the methods need for
      solid evidence: every factor, ratio and range rests on few observations, and the
      differences between methods show how much the answer depends on the method, not how
      precise it is.
    title_tr: Yetersiz kanıt
    template_tr: >-
      {lines} branşın {thin_lines} tanesi için yalnızca {origin_periods} kaynak dönem
      ({first_origin} – {last_origin}) yüklendi; bu sayı, yöntemlerin sağlam kanıt için
      gereksindiği {thin_threshold} değerinin altındadır: her faktör, oran ve aralık az
      gözleme dayanır ve yöntemler arasındaki farklar, sonucun kesinliğini değil, sonucun
      yönteme ne kadar bağlı olduğunu gösterir.
    evidence:
      section: reserving
      files: [diagnostics.csv]
      specs: [MT02, MT10]
  - id: KF02
    title: Blocking data findings
    scope: run
    priority: 1
    condition: blocking_findings > 0
    template: >-
      Blocking data quality findings: {blocking_findings}, on {blocking_rows} rows in all;
      the modules they touch are marked unable and their results should not be read.
    title_tr: Engelleyici veri bulguları
    template_tr: >-
      Engelleyici veri kalitesi bulguları: {blocking_findings}, toplam {blocking_rows}
      satırda; etkiledikleri modüller çalıştırılamaz olarak işaretlendi ve sonuçları
      okunmamalıdır.
    evidence:
      section: quality
      files: [quality.json]
      specs: [DQ01]
  - id: KF03
    title: Reserve estimate per segment
    scope: segment
    priority: 2
    condition: selected_ultimate > 0
    template: >-
      {segment}: selected ultimate claims {selected_ultimate} {currency}, of which
      {selected_ibnr} {currency} ({ibnr_share} of the ultimate) lies above the incurred to
      date (IBNR); the largest part is {largest_line} with {largest_line_ibnr} {currency}.
    title_tr: Segment başına rezerv tahmini
    template_tr: >-
      {segment}: seçilen nihai hasar {selected_ultimate} {currency}; bunun {selected_ibnr}
      {currency} tutarı ({ibnr_share} nihai hasarın) bugüne kadar gerçekleşen hasarın
      üzerindedir (IBNR); en büyük pay {largest_line} branşındadır: {largest_line_ibnr}
      {currency}.
    evidence:
      section: reserving
      files: [ultimates.csv]
      specs: [RS02, MT10]
  - id: KF04
    title: Loss ratio rose
    scope: segment
    priority: 3
    condition: loss_ratio_change >= 0.05
    template: >-
      {segment}: the ultimate loss ratio rose from {loss_ratio_previous} for origin
      {loss_ratio_previous_origin} to {loss_ratio_latest} for origin {loss_ratio_origin}.
    title_tr: Hasar prim oranı yükseldi
    template_tr: >-
      {segment}: nihai hasar prim oranı {loss_ratio_previous_origin} kaynak yılı için
      {loss_ratio_previous} iken {loss_ratio_origin} kaynak yılı için {loss_ratio_latest}
      değerine yükseldi.
    evidence:
      section: profitability
      files: [measures.csv, lineage.csv]
      specs: [RT01]
  - id: KF05
    title: Loss ratio fell
    scope: segment
    priority: 3
    condition: loss_ratio_change <= -0.05
    template: >-
      {segment}: the ultimate loss ratio fell from {loss_ratio_previous} for origin
      {loss_ratio_previous_origin} to {loss_ratio_latest} for origin {loss_ratio_origin}.
    title_tr: Hasar prim oranı düştü
    template_tr: >-
      {segment}: nihai hasar prim oranı {loss_ratio_previous_origin} kaynak yılı için
      {loss_ratio_previous} iken {loss_ratio_origin} kaynak yılı için {loss_ratio_latest}
      değerine düştü.
    evidence:
      section: profitability
      files: [measures.csv, lineage.csv]
      specs: [RT01]
  - id: KF06
    title: Written premium grew
    scope: segment
    priority: 4
    condition: premium_change >= 0.1
    template: >-
      {segment}: written premium grew by {premium_change} to {written_premium} {currency} in
      {premium_period} against {premium_previous_period}.
    title_tr: Yazılan prim arttı
    template_tr: >-
      {segment}: yazılan prim {premium_previous_period} dönemine göre {premium_change}
      artarak {premium_period} döneminde {written_premium} {currency} oldu.
    evidence:
      section: portfolio
      files: [measures.csv, lineage.csv]
      specs: [PR01]
  - id: KF07
    title: Written premium shrank
    scope: segment
    priority: 4
    condition: premium_change <= -0.1
    template: >-
      {segment}: written premium shrank by {premium_decline} to {written_premium} {currency}
      in {premium_period} against {premium_previous_period}.
    title_tr: Yazılan prim azaldı
    template_tr: >-
      {segment}: yazılan prim {premium_previous_period} dönemine göre {premium_decline}
      azalarak {premium_period} döneminde {written_premium} {currency} oldu.
    evidence:
      section: portfolio
      files: [measures.csv, lineage.csv]
      specs: [PR01]
  - id: KF08
    title: Paid ultimate below incurred to date
    scope: run
    priority: 5
    condition: negative_paid_origins > 0
    template: >-
      Origins where the paid chain ladder gives an ultimate below what is already incurred:
      {negative_paid_origins} ({negative_paid_lines}). The paid pattern is too short or case
      reserves are high, so the paid estimates of these origins are not used on their own.
    title_tr: Ödenen bazlı nihai hasar gerçekleşenin altında
    template_tr: >-
      Ödenen hasar zincir merdiven yönteminin, şimdiden gerçekleşmiş tutarın altında nihai
      hasar verdiği kaynak dönemler: {negative_paid_origins} ({negative_paid_lines}).
      Ödeme paterni çok kısa veya muallak hasar karşılıkları yüksek; bu nedenle bu
      dönemlerin ödenen bazlı tahminleri tek başlarına kullanılmaz.
    evidence:
      section: reserving
      files: [diagnostics.csv, ultimates.csv]
      specs: [MT02, RS02]
  - id: KF09
    title: High last development with tail 1.0
    scope: run
    priority: 6
    condition: late_development_count > 0
    template: >-
      Development is still above {late_development_limit} in the last observed period
      ({late_development_list}) while the tail factor is 1.0, so ultimates of these lines may
      be understated; a tail factor can be set in the assumptions register.
    title_tr: Kuyruk faktörü 1,0 iken son gelişim yüksek
    template_tr: >-
      Kuyruk faktörü 1,0 iken son gözlenen dönemde gelişim hâlâ {late_development_limit}
      değerinin üzerinde ({late_development_list}); bu branşların nihai hasarı eksik
      tahmin edilmiş olabilir; kuyruk faktörü varsayım kaydında belirlenebilir.
    evidence:
      section: reserving
      files: [diagnostics.csv, assumptions.csv]
      specs: [MT02, RS01]
  - id: KF10
    title: Anomaly rate above the limit
    scope: run
    priority: 7
    condition: anomaly_lines_above > 0
    template: >-
      Lines where the robust z-score flags more than {anomaly_rate_limit} of the values:
      {anomaly_lines_above} (highest {anomaly_rate_max} in {anomaly_rate_max_line}). Such a
      line may mix populations, so its flags are leads to review, not errors.
    title_tr: Anomali oranı sınırın üzerinde
    template_tr: >-
      Sağlam z-skorunun değerlerin {anomaly_rate_limit} oranından fazlasını işaretlediği
      branşlar: {anomaly_lines_above} (en yüksek {anomaly_rate_max},
      {anomaly_rate_max_line}). Böyle bir branş farklı yapıları karıştırıyor olabilir;
      işaretleri hata değil, incelenecek ipuçlarıdır.
    evidence:
      section: anomalies
      files: [anomalies.csv]
      specs: [MT08]
  - id: KF11
    title: Factor on a zero denominator
    scope: run
    priority: 8
    condition: zero_denominator_cells > 0
    template: >-
      Development factors that take a cell growing from zero: {zero_denominator_cells}
      ({zero_denominator_list}). Such a cell adds to the numerator only and raises the
      factor; it is kept by default and can be excluded in the assumptions register.
    title_tr: Sıfır paydalı faktör
    template_tr: >-
      Sıfırdan büyüyen bir hücreyi alan gelişim faktörleri: {zero_denominator_cells}
      ({zero_denominator_list}). Böyle bir hücre yalnızca paya eklenir ve faktörü
      yükseltir; varsayılan olarak tutulur ve varsayım kaydında dışlanabilir.
    evidence:
      section: reserving
      files: [diagnostics.csv, factors.csv]
      specs: [MT02, RS01]
  - id: KF12
    title: Factors on few origins
    scope: run
    priority: 9
    condition: few_link_ratio_factors > 0
    template: >-
      Development factors resting on fewer than {few_link_ratio_minimum} origins:
      {few_link_ratio_factors}, in {few_link_ratio_lines} of {lines} lines. Each is an average
      of one or two link ratios.
    title_tr: Az kaynak dönemli faktörler
    template_tr: >-
      {few_link_ratio_minimum} kaynak dönemden azına dayanan gelişim faktörleri:
      {few_link_ratio_factors}; {lines} branşın {few_link_ratio_lines} tanesinde. Her biri
      bir veya iki bağlantı oranının ortalamasıdır.
    evidence:
      section: reserving
      files: [diagnostics.csv, factors.csv]
      specs: [MT02, RS01]
  - id: KF13
    title: Reserve range not available
    scope: run
    priority: 10
    condition: mack_not_run > 0
    template: >-
      Triangles without a reserve range: {mack_not_run} of {mack_triangles}. The Mack
      standard error needs more link ratios than they have.
    title_tr: Rezerv aralığı yok
    template_tr: >-
      Rezerv aralığı bulunmayan üçgenler: {mack_triangles} üçgenin {mack_not_run} tanesi.
      Mack standart hatası, bu üçgenlerde bulunandan daha fazla bağlantı oranı gerektirir.
    evidence:
      section: reserving
      files: [reserve_range.csv]
      specs: [MT06, RS03]
  - id: KF14
    title: Data quality warnings
    scope: run
    priority: 11
    condition: warning_findings > 0
    template: >-
      Data quality score {dq_score} out of 100. Warnings: {warning_findings}, on
      {warning_rows} rows in all; the largest is "{top_warning}".
    title_tr: Veri kalitesi uyarıları
    template_tr: >-
      Veri kalitesi puanı 100 üzerinden {dq_score}. Uyarılar: {warning_findings}, toplam
      {warning_rows} satırda; en büyüğü "{top_warning}".
    evidence:
      section: quality
      files: [quality.json]
      specs: [DQ01]
  - id: KF15
    title: Modules not run
    scope: run
    priority: 12
    condition: modules_skipped > 0
    template: >-
      Modules that did not run because their data was not loaded: {modules_skipped} of
      {modules_total} ({skipped_list}).
    title_tr: Çalışmayan modüller
    template_tr: >-
      Verileri yüklenmediği için çalışmayan modüller: {modules_total} modülün
      {modules_skipped} tanesi ({skipped_list}).
    evidence:
      section: not-run
      files: [modules.json]
      specs: []
  - id: KF16
    title: Modules limited
    scope: run
    priority: 13
    condition: modules_limited > 0
    template: >-
      Modules that ran with some measures or methods missing: {modules_limited}
      ({limited_list}).
    title_tr: Sınırlı çalışan modüller
    template_tr: >-
      Bazı ölçü veya yöntemleri eksik olarak çalışan modüller: {modules_limited}
      ({limited_list}).
    evidence:
      section: not-run
      files: [modules.json]
      specs: []
  - id: KF20
    title: Thin evidence in the line
    scope: line
    priority: 0
    condition: thin_evidence > 0
    template: >-
      Origin periods: {origin_periods}, fewer than {thin_threshold}. The methods below agree
      or differ on little evidence.
    title_tr: Branşta yetersiz kanıt
    template_tr: >-
      Kaynak dönem sayısı: {origin_periods}; {thin_threshold} değerinin altında. Aşağıdaki
      yöntemler az kanıta dayanarak birbirine yakın veya uzak sonuç verir.
    evidence:
      section: line
      files: [diagnostics.csv]
      specs: [MT02]
  - id: KF21
    title: Methods differ
    scope: line
    priority: 1
    condition: method_spread >= 0.1
    template: >-
      The total ultimates of the methods on the incurred triangle lie between {method_low} and
      {method_high} {currency}, {method_spread} of the selected ultimate apart; this spread
      shows how much the answer depends on the method, not a confidence interval.
    title_tr: Yöntemler birbirinden farklı
    template_tr: >-
      Gerçekleşen hasar üçgeninde yöntemlerin toplam nihai hasarları {method_low} ile
      {method_high} {currency} arasındadır; seçilen nihai hasarın {method_spread} kadar
      uzağında. Bu fark, sonucun yönteme ne kadar bağlı olduğunu gösterir, bir güven
      aralığı değildir.
    evidence:
      section: line
      files: [ultimates.csv]
      specs: [MT02, MT03, MT04, MT05, MT10]
  - id: KF22
    title: Paid ultimate below incurred in the line
    scope: line
    priority: 2
    condition: negative_paid_origins > 0
    template: >-
      Origins whose paid chain ladder ultimate is below the incurred to date:
      {negative_paid_list}.
    title_tr: Branşta ödenen bazlı nihai hasar gerçekleşenin altında
    template_tr: >-
      Ödenen hasar zincir merdiven nihai hasarının bugüne kadar gerçekleşenin altında
      kaldığı kaynak dönemler: {negative_paid_list}.
    evidence:
      section: line
      files: [diagnostics.csv]
      specs: [MT02]
  - id: KF23
    title: High last development in the line
    scope: line
    priority: 3
    condition: late_development_count > 0
    template: >-
      Last observed development {late_development_list} is above {late_development_limit}
      with tail factor 1.0: the ultimate may be understated.
    title_tr: Branşta son gelişim yüksek
    template_tr: >-
      Son gözlenen gelişim {late_development_list}, {late_development_limit} değerinin
      üzerinde ve kuyruk faktörü 1,0: nihai hasar eksik tahmin edilmiş olabilir.
    evidence:
      section: line
      files: [diagnostics.csv]
      specs: [MT02]
  - id: KF24
    title: Zero denominator in the line
    scope: line
    priority: 4
    condition: zero_denominator_cells > 0
    template: >-
      Factors resting on a cell that grows from zero: {zero_denominator_list}.
    title_tr: Branşta sıfır payda
    template_tr: >-
      Sıfırdan büyüyen bir hücreye dayanan faktörler: {zero_denominator_list}.
    evidence:
      section: line
      files: [diagnostics.csv]
      specs: [MT02]
  - id: KF25
    title: Few link ratios in the line
    scope: line
    priority: 5
    condition: few_link_ratio_factors > 0
    template: >-
      Factors resting on fewer than {few_link_ratio_minimum} origins:
      {few_link_ratio_factors} ({few_link_ratio_list}).
    title_tr: Branşta az bağlantı oranı
    template_tr: >-
      {few_link_ratio_minimum} kaynak dönemden azına dayanan faktörler:
      {few_link_ratio_factors} ({few_link_ratio_list}).
    evidence:
      section: line
      files: [diagnostics.csv]
      specs: [MT02]
  - id: KF26
    title: Anomaly rate of the line
    scope: line
    priority: 6
    condition: anomaly_rate > anomaly_rate_limit
    template: >-
      Payments and case-reserve movements flagged: {anomaly_flagged} of {anomaly_values}
      ({anomaly_rate}, above {anomaly_rate_limit}); the line may mix populations.
    title_tr: Branşın anomali oranı
    template_tr: >-
      İşaretlenen ödeme ve muallak hasar hareketleri: {anomaly_values} değerin
      {anomaly_flagged} tanesi ({anomaly_rate}, sınır {anomaly_rate_limit} üzerinde);
      branş farklı yapıları karıştırıyor olabilir.
    evidence:
      section: anomalies
      files: [anomalies.csv]
      specs: [MT08]
  - id: KF27
    title: Munich chain ladder differs from the selection
    scope: line
    priority: 7
    condition: munich_gap_size >= 0.1
    template: >-
      The Munich chain ladder gives {munich_incurred} {currency} on incurred and
      {munich_paid} {currency} on paid, {munich_gap} against the selected ultimate: paid and
      incurred tell different stories on this line, and the selection rests on one of them.
    title_tr: Munich zincir merdiven seçimden farklı
    template_tr: >-
      Munich zincir merdiven gerçekleşen üzerinde {munich_incurred} {currency}, ödenen
      üzerinde {munich_paid} {currency} veriyor; seçilen nihai tutara göre fark
      {munich_gap}: bu branşta ödenen ve gerçekleşen farklı şeyler söylüyor ve seçim
      bunlardan birine dayanıyor.
    evidence:
      section: line
      files: [tier_b_ultimates.csv, ultimates.csv]
      specs: [MT12, MT10]
  - id: KF28
    title: The selection missed in the back test
    scope: line
    priority: 8
    condition: back_test_bias_size >= 0.05 and back_test_sign_share >= back_test_sign_share_limit
    template: >-
      Rerun on the data known {back_test_horizon} months earlier, the selected ultimate was
      off by {back_test_bias} on average over {back_test_origins} origins against what was
      known later; the method has erred in one direction on this line before.
    title_tr: Seçim geriye dönük testte saptı
    template_tr: >-
      {back_test_horizon} ay önce bilinen veriyle yeniden çalıştırıldığında seçilen nihai
      tutar, sonradan bilinene göre {back_test_origins} kaynak dönemde ortalama
      {back_test_bias} saptı; yöntem bu branşta daha önce de tek yönde yanılmış.
    evidence:
      section: line
      files: [back_test.csv]
      specs: [MT22, AE02, MT10]
  - id: KF29
    title: The fitted tail changes the reserve
    scope: line
    priority: 9
    condition: tail_fitted_change >= 0.1
    template: >-
      With the tail of the curve MT14 fitted instead of the tail {tail_factor} of the run, the
      selected IBNR would be {tail_fitted_ibnr} {currency} ({tail_fitted_change} more):
      development after the last age matters on this line.
    title_tr: Uydurulan kuyruk rezervi değiştiriyor
    template_tr: >-
      Çalıştırmanın {tail_factor} kuyruğu yerine MT14'ün uydurduğu eğrinin kuyruğu
      kullanılsaydı seçilen IBNR {tail_fitted_ibnr} {currency} olurdu ({tail_fitted_change}
      fazla): bu branşta son yaştan sonraki gelişim önemlidir.
    evidence:
      section: line
      files: [sensitivity.csv, tier_b_parameters.csv]
      specs: [MT14, MT02]
  - id: KF30
    title: The reserve is sensitive to the tail
    scope: line
    priority: 10
    condition: tail_up_change >= 0.25
    template: >-
      A tail factor {tail_step} higher would add {tail_up_difference} {currency} to the selected
      IBNR ({tail_up_change}): most of this line's reserve depends on how much development is
      left after the last age.
    title_tr: Rezerv kuyruğa duyarlı
    template_tr: >-
      {tail_step} daha yüksek bir kuyruk faktörü seçilen IBNR'ye {tail_up_difference} {currency}
      ekler ({tail_up_change}): bu branşın rezervinin çoğu, son yaştan sonra ne kadar gelişim
      kaldığına bağlıdır.
    evidence:
      section: sensitivity
      files: [sensitivity.csv]
      specs: [MT02, MT10]
  - id: KF31
    title: Heavy tail of large claims
    scope: line
    priority: 11
    condition: gpd_shape >= 0.5
    template: >-
      Above {gpd_threshold} {currency} the {gpd_exceedances} largest claims have a fitted
      generalised Pareto shape of {gpd_shape}, at least 0.5: the fitted tail
      has no finite variance, so single claims can dominate the results of this line.
    title_tr: Büyük hasarlarda kalın kuyruk
    template_tr: >-
      {gpd_threshold} {currency} üzerindeki en büyük {gpd_exceedances} hasarın uydurulan
      genelleştirilmiş Pareto biçim parametresi {gpd_shape}, yani en az 0,5:
      uydurulan kuyruğun sonlu varyansı yoktur, bu branşın sonuçlarını tek tek hasarlar
      belirleyebilir.
    evidence:
      section: large-losses
      files: [extreme_gpd_fit.csv]
      specs: [MT18]
  - id: KF32
    title: Settlement speed differs between report years
    scope: segment
    priority: 14
    condition: cohort_logrank_p < cohort_significance and cohort_median_ratio >= cohort_median_ratio_limit
    template: >-
      {segment}: claims of different report years settle at different speeds (log-rank test
      over {cohort_years} report years, p-value {cohort_logrank_p}); the development of the
      older years may not hold for the recent ones.
    title_tr: Rapor yılları arasında kapanış hızı farklı
    template_tr: >-
      {segment}: farklı rapor yıllarının hasarları farklı hızlarda kapanıyor ({cohort_years}
      rapor yılı üzerinde log-rank testi, p değeri {cohort_logrank_p}); eski yılların gelişimi
      yeni yıllar için geçerli olmayabilir.
    evidence:
      section: settlement-speed
      files: [survival_cohorts.csv]
      specs: [MT19]
  - id: KF33
    title: Width of the reserve range
    scope: run
    priority: 15
    condition: range_upper_width >= 0.25
    template: >-
      The selected unpaid of all lines, {range_reserve} {currency}, has a 95th percentile of
      {range_p95} {currency}, {range_upper_width} above it ({range_source}); the range is an
      indicative approximation, not a capital requirement.
    title_tr: Rezerv aralığının genişliği
    template_tr: >-
      Tüm branşların seçilen ödenmemiş tutarı {range_reserve} {currency}; 95. yüzdeliği
      {range_p95} {currency}, yani {range_upper_width} üzerinde ({range_source}); aralık
      gösterge niteliğinde bir yaklaşımdır, sermaye gereksinimi değildir.
    evidence:
      section: uncertainty
      files: [risk_measures.csv]
      specs: [RS03, RS05, M12]
  - id: KF34
    title: Discount effect
    scope: run
    priority: 16
    condition: discount_share >= 0.05
    template: >-
      Discounted with the curve {discount_curve} of {discount_curve_date}, the selected unpaid
      of all lines falls from {discount_nominal} to {discount_present} {currency}
      ({discount_share} less); switch the value basis at the top of the page to see the
      discounted figures.
    title_tr: İndirgeme etkisi
    template_tr: >-
      {discount_curve_date} tarihli {discount_curve} eğrisiyle indirgendiğinde tüm
      branşların seçilen ödenmemiş tutarı {discount_nominal} değerinden {discount_present}
      {currency} değerine düşer ({discount_share} daha az); indirgenmiş tutarları görmek için
      sayfanın üstündeki değer bazını değiştirin.
    evidence:
      section: uncertainty
      files: [risk_measures.csv, discount_curve.csv]
      specs: [RS04, CV10]
change_log:
  - version: 1.0.0
    date: 2026-10-22
    change: First rules for the executive report (work item P10).
  - version: 1.1.0
    date: 2026-10-23
    change: >-
      Every rule has a Turkish title and sentence template (title_tr, template_tr) beside
      the English ones, with the same conditions and placeholders; the report is written
      in Turkish with --lang tr (record 0224). No condition or English sentence changes.
  - version: 1.2.0
    date: 2026-11-07
    change: >-
      Eight rules for the results of version 1.2 (work item P27, record 0345), in English
      and Turkish: KF27 Munich chain ladder against the selection, KF28 bias of the
      selection in the back test, KF29 effect of the fitted tail, KF30 sensitivity to the
      tail, KF31 heavy tail of large claims, KF32 settlement speed by report year, KF33 width
      of the reserve range, KF34 discount effect. KF01 to KF26 are unchanged. Not reviewed
      by the owner yet (gate G5).
  - version: 1.2.1
    date: 2026-11-08
    change: >-
      Three rules say no more than their conditions prove (work item P27b, record 0347).
      KF28 also requires that the errors of the back test keep one sign: the share of the
      back-tested origins whose error has the sign of the mean bias must reach the new
      setting back_test_sign_share_limit (0.75). KF31 tests the fixed shape 0.5 written in
      the rule, the only shape from which the fitted tail has no finite variance; the
      configurable limit and its placeholder are gone. KF32 also requires an effect: the
      longest median settlement time over the shortest, across the report years with at
      least 20 closings, must reach the new setting cohort_median_ratio_limit (1.25). The
      sentences keep their wording (KF31 names 0.5 instead of a placeholder). The file gains
      a settings block for the two limits. Not reviewed by the owner yet (gate G5).
