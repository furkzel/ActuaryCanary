id: M12
version: 1.3.0
title_en: Uncertainty and risk
title_tr: Belirsizlik ve risk
status: reviewed
definition: >-
  How wide the reserve range is: the Mack lognormal range and the bootstrap distribution
  side by side, value at risk and tail value at risk, the effect of a fitted tail, and
  the discounted reserve with its discount effect.
phase: 2
question: How wide is the reserve range; what are VaR and TVaR?
required_all: [claim_valuations]
required_any: []
optional: [claims, premiums, policies, market, interest_rates]
measures: [RS03, RS04, RS05]
methods: [MT01, MT02, MT03, MT04, MT06, MT10, MT11, MT14]
skip_reason: >-
  Uncertainty and risk did not run: no claim valuations were loaded. Load
  claim_valuations.xlsx to enable it; add interest_rates.xlsx and name a curve for the
  discounted reserve.
blocking_rules: [DV-CLV-01]
outputs:
  - risk_distribution.parquet (simulations of the reserve per line and for all lines, nominal and discounted; the simulations per origin stay in bootstrap_distribution_<line>.parquet of MT11)
  - risk_measures.csv (RS03 and RS05 per origin, per line and for all lines, side by side)
  - risk_cash_flows.csv (RS04 expected cash flows and MT11 percentile cash flows by calendar period, nominal and discounted)
  - discount_curve.csv (the curve used, with its id, date and source)
report_page:
  - Headline - selected reserve with the bootstrap 5 to 95 per cent range and its coefficient of variation.
  - Ranges side by side - Mack lognormal (RS03) and bootstrap (RS05), per line, labelled as approximations.
  - Distribution of the total reserve (histogram) with VaR and TVaR marked.
  - What the totals rest on, and the pseudo-triangles of the bootstrap - per line, the share with a zero or negative denominator, a negative cumulative value, a negative or extreme factor (MT11, record 0778), counted after the rule of the refit and the floor of the pseudo increments (MT11 1.4.0, records 0783 and 0784).
  - Tail factor - fitted curves and their effect on the ultimate (MT14).
  - Expected cash flows by calendar year, nominal and discounted, with the curve used (RS04, CV10).
  - Calibration notes - the coverage evidence of MT06 and MT11 and the lines where the ranges are known to be narrow.
notes: >-
  Indicative ranges, never capital requirements. Without a named curve the discounted view
  is left out with its reason. Built by the uncertainty and discounting item.
change_log:
  - version: 0.1.0
    date: 2026-10-23
    change: First draft from blueprint section 10 (P20).
  - version: 1.0.0
    date: 2026-10-25
    change: Reviewed and accepted by the owner.
  - version: 1.1.0
    date: 2026-11-07
    change: >-
      Built by P26 (record 0326): the output files have names of their own because reserve_range.csv
      (RS03 per line, M04) and cash_flows.csv (MT07) already exist and keep their content.
      Amended by the uncertainty and discounting work item (P26); the owner has not reviewed this version yet.
  - version: 1.1.1
    date: 2026-11-09
    change: >-
      MT11 1.2.0 cuts trailing development columns without a positive paid amount instead of
      stopping (decision 0349), so the bootstrap range now exists for short-tail lines and the
      simulated total of all lines exists whenever every line has one. The notes of M12 and the
      part "what the totals rest on" state the cut. No other change; the owner has not reviewed
      this version.
  - version: 1.2.0
    date: 2026-11-12
    change: >-
      The page gains a table of the defects of the bootstrap's pseudo-triangles beside the notes
      of what the totals rest on (A1b, R04, record 0778). No figure of a range changes. How far
      the all-lines VaR 99.5 per cent and TVaR 99 per cent move with the seed is measured by the
      script docs/tools/seed_stability.py, not by a run (record 0779). The owner has not reviewed
      this version yet.
  - version: 1.3.0
    date: 2026-11-12
    change: >-
      The bootstrap behind the ranges of RS05 is MT11 1.4.0 (A1c, R04): a thin column takes the
      factor 1.000 in the refit, no pseudo increment is below zero, and 50,000 simulations by
      default (records 0783 to 0785). The simulated ranges, VaR, TVaR, the histogram and the
      defect shares of the page move with it; the means stay rescaled to the selected unpaid. The
      note on the pseudo-triangles says that the shares are counted after the rule and the
      floor. The owner has not reviewed this version.
