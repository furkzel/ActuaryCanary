id: M04
version: 1.2.0
title_en: Reserving (indicative)
title_tr: Karşılık tahmini (gösterge)
status: reviewed
definition: >-
  Development triangles, factors, ultimates by several methods with a selection, the
  reserve range and actual versus expected development. Indicative, never an official
  reserve.
phase: 1
question: What will claims finally cost, and how sure are we?
required_all: [claim_valuations]
required_any: []
optional: [claims, premiums, policies, market]
measures: [RS01, RS02, RS03, AE01, CL10]
methods: [MT01, MT02, MT03, MT04, MT05, MT06, MT07, MT10, MT11, MT12, MT13, MT14, MT15, MT16, MT22]
skip_reason: >-
  Reserving did not run: no claim valuations were loaded. Load claim_valuations.xlsx to
  enable it; add claims.xlsx for accident-period origins, premiums.xlsx with policies.xlsx
  for Bornhuetter–Ferguson and Cape Cod, and market.xlsx for the inflation-adjusted view.
outputs:
  - triangles.csv, factors.csv, chain_ladder.csv, ultimates.csv, reserve_range.csv, cash_flows.csv, diagnostics.csv, assumptions.csv (tier A, unrounded, CV06)
  - tier_b_ultimates.csv (MT12, MT13, MT15 and MT16 ultimates per origin, or the reason a method did not run)
  - tier_b_parameters.csv (fitted quantities of MT11 to MT16, the MT14 tail curves among them)
  - bootstrap_summary.csv, bootstrap_cash_flows.csv, bootstrap_residuals.csv (MT11 per line)
  - bootstrap_distribution_<segment>_<line>.parquet (MT11 simulated reserves, where MT11 ran)
  - back_test.csv (MT22 with AE02 - errors per method and horizon, range calibration, reasons)
  - sensitivity.csv (the reserve under variants of the selected factors, the tail, the future inflation and the discount curve, computed in the same run; record 0343; from 1.2.0 also the variant thin_average, the selected unpaid with the average put back for a factor the rule set to 1.000)
report_page:
  - Summary per line - paid, incurred, chain-ladder ultimates, selected ultimate and IBNR, diagnostics.
  - Per line - heatmaps, factors with the selection (the link ratios behind each factor and the factors the rule set to 1.000), the tail factor box (the tail used, where it comes from, the share of open claims, the curves fitted by MT14), ultimates of tier A and tier B side by side with the selection, the fitted tails (MT14), Munich paid and incurred (MT12), the reserve range, the inflation-adjusted chain ladder, the back test (MT22, AE02), and the diagnostics beside each method.
  - Sensitivity - the reserve under each variant against the reserve of the run.
notes: >-
  Without claims, origins are first-valuation months (proxy report periods, decision 0008)
  and the premium-based methods report that they need accident origins. The module setting
  min_origins_per_factor (default 2; 1 applies no rule) sets a development factor that rests
  on fewer link ratios to 1.000; MT02, MT06 and MT07 use the same factors (record 0776).
