id: M06
version: 1.2.0
title_en: Anomalies and large losses
title_tr: Anomaliler ve büyük hasarlar
status: reviewed
definition: >-
  Payments, reserve changes and claims that look unusual, and the claims that dominate
  results by size, with their share of incurred.
phase: 1
question: What looks wrong or unusual?
required_all: [claim_valuations]
required_any: []
optional: [claims, policies, market]
measures: [CL12]
methods: [MT08, MT09, MT17, MT18]
skip_reason: >-
  Anomalies and large losses did not run: no claim valuations were loaded. Load
  claim_valuations.xlsx to enable it; add claims.xlsx for lines and catastrophe codes.
outputs:
  - anomalies.csv (MT08 and MT09 flags with their rows)
  - extreme_thresholds.csv and extreme_candidates.csv (MT18 threshold per segment and line from the ForwardStop scan, or the reason)
  - extreme_gpd_fit.csv (MT18 generalised Pareto fit with the profile interval of the shape)
  - extreme_tail_quantiles.csv and extreme_return_levels.csv (MT18 tail quantiles, expected shortfall and return levels)
  - extreme_threshold_comparison.csv (MT18 threshold beside the CV08 threshold, with the claims and incurred above each)
  - extreme_mean_excess.csv and extreme_excess_plot.csv (MT18 mean excess and parameter stability)
  - extreme_yearly.csv and extreme_yearly_summary.csv (MT18 exceedances per year, their dispersion and trend)
report_page:
  - Anomalies - share flagged by line with the MT08 limit, the largest flags with their rows.
  - Large losses - the fitted severity families of MT17 with the selection, the CV08 threshold and the MT18 threshold side by side, the exceedances per year, the generalised Pareto fit, tail quantiles and return levels.
notes: >-
  Large-loss classes follow CV08: the 99th percentile of claim sizes per segment and line
  unless project.yaml sets another percentile or fixed thresholds. The extreme-value
  threshold of MT18 is not used here; it is reported beside the CV08 threshold when MT18
  runs (record 0601).
