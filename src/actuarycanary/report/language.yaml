    tr: "CV08'in sınıfladığı hasar büyüklüklerine en çok olabilirlikle uydurulan şiddet aileleri ({spec}); Kolmogorov–Smirnov ve Anderson–Darling p değerleri bootstrap ile; seçilen aile, Anderson–Darling testinin reddetmediği aileler arasında en düşük AIC değerine sahip olandır. severity_fits.csv, severity_selected.csv ve severity_quantiles.csv satırları."
  - en: "The large-loss threshold of the run is CV08's ({cv08}); the extreme-value threshold of MT18 ({mt18}, ForwardStop over the candidate quantiles) is shown beside it and classes no claim (record 0601). Rows of extreme_threshold_comparison.csv and extreme_thresholds.csv."
    tr: "Çalıştırmanın büyük hasar eşiği CV08'inkidir ({cv08}); MT18'in uç değer eşiği ({mt18}, aday yüzdelikler üzerinde ForwardStop) yanında gösterilir ve hiçbir hasarı sınıflamaz (kayıt 0601). extreme_threshold_comparison.csv ve extreme_thresholds.csv satırları."
  - en: "Generalised Pareto fit above the extreme-value threshold with the profile interval of the shape; tail quantiles with the expected shortfall, and return levels per number of years ({spec}). Rows of extreme_gpd_fit.csv, extreme_tail_quantiles.csv, extreme_return_levels.csv and extreme_yearly_summary.csv."
    tr: "Uç değer eşiği üzerinde genelleştirilmiş Pareto uyumu ve biçim parametresinin profil aralığı; beklenen kayıpla kuyruk yüzdelikleri ve yıl sayısına göre dönüş düzeyleri ({spec}). extreme_gpd_fit.csv, extreme_tail_quantiles.csv, extreme_return_levels.csv ve extreme_yearly_summary.csv satırları."
