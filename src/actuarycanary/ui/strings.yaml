    tr: "Bu klasör okunamıyor."

  # --- mapping -----------------------------------------------------------------------------
  - id: mapping.title
    en: "What was recognised"
    tr: "Neler tanındı"
  - id: mapping.intro
    en: "For each sheet: the kind of data found, how sure the program is, and which column became which field. Change a field in the list, choose “not used” to ignore a column, then confirm. A confirmed mapping is saved and used by the next run, here or in the terminal."
    tr: "Her sayfa için: bulunan veri türü, programın ne kadar emin olduğu ve hangi sütunun hangi alan olduğu. Listeden bir alanı değiştirin, bir sütunu yok saymak için “kullanılmıyor”u seçin, sonra onaylayın. Onaylanan eşleme kaydedilir ve bir sonraki çalıştırmada, burada veya terminalde kullanılır."
  - id: mapping.summary
    en: "{folder}: {files} file(s), {sheets} sheet(s); {pending} sheet(s) have a layout without a saved mapping."
    tr: "{folder}: {files} dosya, {sheets} sayfa; {pending} sayfanın kayıtlı eşlemesi olmayan bir düzeni var."
