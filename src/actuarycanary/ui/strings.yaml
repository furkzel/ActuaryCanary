# Texts of the browser interface (record 0705): id, English and Turkish side by side. {name} marks
# what is filled in and must appear in both languages. Text written by the pipeline (data
# messages, errors of a run, the evidence of a mapping) is shown as the pipeline wrote it.
version: 1
entries:
  # --- frame -------------------------------------------------------------------------------
  - id: app.title
    en: "ActuaryCanary"
    tr: "ActuaryCanary"
  - id: app.tagline
    en: "Local interface"
    tr: "Yerel arayüz"
  - id: app.label_strong
    en: "Indicative — not an official reserve or price."
    tr: "Gösterge niteliğindedir — resmî rezerv veya fiyat değildir."
  - id: app.label
    en: "This page runs on your computer only; nothing is sent anywhere."
    tr: "Bu sayfa yalnızca kendi bilgisayarınızda çalışır; hiçbir şey dışarı gönderilmez."
  - id: app.local_only
    en: "Local address, private to this start of the program."
    tr: "Yerel adres, programın bu başlatılışına özel."
  - id: a11y.skip
    en: "Skip to the content"
    tr: "İçeriğe geç"
  - id: nav.label
    en: "Main"
    tr: "Ana menü"
  - id: nav.start
    en: "Start"
    tr: "Başlangıç"
  - id: nav.past
    en: "Past runs"
    tr: "Önceki çalıştırmalar"
  - id: nav.quit
    en: "Quit"
    tr: "Çık"
  - id: quit.confirm_running
    en: "A run is going. Quitting stops it and leaves partial files. Quit anyway?"
    tr: "Bir çalıştırma sürüyor. Çıkmak onu durdurur ve yarım dosyalar bırakır. Yine de çıkılsın mı?"
  - id: quit.done
    en: "The program has stopped"
    tr: "Program durdu"
  - id: quit.done_text
    en: "You can close this tab. Start `canary ui` again to come back; finished runs stay in the output folder."
    tr: "Bu sekmeyi kapatabilirsiniz. Geri dönmek için `canary ui` komutunu yeniden başlatın; biten çalıştırmalar çıktı klasöründe kalır."

  # --- start -------------------------------------------------------------------------------
  - id: start.title
    en: "Start"
    tr: "Başlangıç"
  - id: start.intro
    en: "Pick the folder with your Excel files, look at how the program understood them, and run. Everything here does what the command line does."
    tr: "Excel dosyalarınızın bulunduğu klasörü seçin, programın bunları nasıl anladığına bakın ve çalıştırın. Buradaki her şey komut satırının yaptığını yapar."
  - id: start.folder_heading
    en: "Where are the files?"
    tr: "Dosyalar nerede?"
  - id: start.folder
    en: "Folder with the Excel files"
    tr: "Excel dosyalarının bulunduğu klasör"
  - id: start.browse
    en: "Browse…"
    tr: "Gözat…"
  - id: start.folder_hint
    en: "Type the path or use Browse. The files are read where they are; nothing is uploaded."
    tr: "Yolu yazın veya Gözat'ı kullanın. Dosyalar bulundukları yerde okunur; hiçbir şey yüklenmez."
  - id: start.out
    en: "Output folder"
    tr: "Çıktı klasörü"
  - id: start.out_hint
    en: "Each run gets its own folder here, named by its run id. Nothing is deleted."
    tr: "Her çalıştırma burada, kimliğiyle adlandırılmış kendi klasörünü alır. Hiçbir şey silinmez."
  - id: start.settings_heading
    en: "Settings"
    tr: "Ayarlar"
  - id: start.more
    en: "More settings"
    tr: "Diğer ayarlar"
  - id: start.command_heading
    en: "The same on the command line"
    tr: "Komut satırında aynısı"
  - id: start.command_hint
    en: "Your choices as a command; the same command in a terminal gives the same run id and files."
    tr: "Seçimleriniz bir komut olarak; aynı komut terminalde aynı çalıştırma kimliğini ve dosyaları verir."
  - id: start.copy
    en: "Copy"
    tr: "Kopyala"
  - id: start.copied
    en: "The command is copied."
    tr: "Komut kopyalandı."
  - id: start.copy_manual
    en: "The command is selected; press Ctrl+C to copy it."
    tr: "Komut seçildi; kopyalamak için Ctrl+C'ye basın."
  - id: start.check
    en: "Check the files"
    tr: "Dosyaları kontrol et"
  - id: start.run_now
    en: "Run now"
    tr: "Şimdi çalıştır"
  - id: start.demo
    en: "Run the demo"
    tr: "Demoyu çalıştır"
  - id: start.actions_hint
    en: "Check the files shows what was recognised and lets you correct it (recommended). Run now uses the proposals as they are, like --yes. The demo runs on the example data that ships with the program."
    tr: "Dosyaları kontrol et, nelerin tanındığını gösterir ve düzeltmenize izin verir (önerilir). Şimdi çalıştır, önerileri olduğu gibi kullanır (--yes gibi). Demo, programla gelen örnek veri üzerinde çalışır."
  - id: start.checking
    en: "Reading the files…"
    tr: "Dosyalar okunuyor…"

  # --- settings ----------------------------------------------------------------------------
  - id: set.lang
    en: "Language of the page and report"
    tr: "Sayfa ve rapor dili"
  - id: set.lang_hint
    en: "The report is written in this language (--lang). The terminal stays English."
    tr: "Rapor bu dilde yazılır (--lang). Terminal İngilizce kalır."
  - id: set.currency
    en: "Reporting currency"
    tr: "Raporlama para birimi"
  - id: set.currency_hint
    en: "Three letters, for example TRY. Empty: the program default. Other currencies are converted."
    tr: "Üç harf, örneğin TRY. Boş: programın varsayılanı. Diğer para birimleri çevrilir."
  - id: set.basis
    en: "Reinsurance basis"
    tr: "Reasürans bazı"
  - id: set.basis_hint
    en: "Gross, ceded or net."
    tr: "Brüt, devredilen veya net."
  - id: set.value
    en: "Value basis"
    tr: "Değer bazı"
  - id: set.value_hint
    en: "Nominal amounts, amounts adjusted for inflation, or future payments discounted at a curve."
    tr: "Nominal tutarlar, enflasyona göre düzeltilmiş tutarlar veya bir eğriyle iskonto edilmiş gelecek ödemeler."
  - id: set.curve
    en: "Interest-rate curve"
    tr: "Faiz eğrisi"
  - id: set.curve_hint
    en: "curve_id of the interest_rates sheet. Needed for the discounted basis; with any basis it adds the discounted figures."
    tr: "interest_rates sayfasındaki curve_id. İskontolu baz için gerekir; herhangi bir bazda iskontolu rakamları ekler."
  - id: set.discount_date
    en: "Discount date"
    tr: "İskonto tarihi"
  - id: set.discount_date_hint
    en: "Date the present values refer to, YYYY-MM-DD. Empty: the cut-off."
    tr: "Bugünkü değerlerin ilgili olduğu tarih, YYYY-AA-GG. Boş: kesim tarihi."
  - id: set.value_date
    en: "Value date (prices)"
    tr: "Değer tarihi (fiyatlar)"
  - id: set.value_date_hint
    en: "Prices of this date for the inflation-adjusted basis, YYYY-MM-DD. Empty: the cut-off."
    tr: "Enflasyon düzeltmeli baz için bu tarihin fiyatları, YYYY-AA-GG. Boş: kesim tarihi."
  - id: set.origin_axis
    en: "Origin axis"
    tr: "Kaynak ekseni"
  - id: set.origin_period
    en: "Origin period"
    tr: "Kaynak dönemi"
  - id: set.development_period
    en: "Development period"
    tr: "Gelişim dönemi"
  - id: set.currency_view
    en: "Currency view"
    tr: "Para birimi görünümü"
  - id: set.currency_view_hint
    en: "Reporting: everything in one currency. Original: nothing converted, each currency kept apart."
    tr: "Raporlama: her şey tek para biriminde. Orijinal: hiçbir şey çevrilmez, her para birimi ayrı tutulur."
  - id: set.price_index
    en: "Price index"
    tr: "Fiyat endeksi"
  - id: set.price_index_hint
    en: "series_id of the price index. Empty: from the project settings."
    tr: "Fiyat endeksinin series_id değeri. Boş: proje ayarlarından."
  - id: set.lineage_format
    en: "Lineage format"
    tr: "Köken kaydı biçimi"
  - id: set.lineage_format_hint
    en: "2 (default) is much smaller on large inputs."
    tr: "2 (varsayılan) büyük girdilerde çok daha küçüktür."
  - id: set.assumptions
    en: "Assumptions file"
    tr: "Varsayımlar dosyası"
  - id: set.assumptions_hint
    en: "Path of a YAML file with your judgements (--assumptions). Empty: none."
    tr: "Yargılarınızı içeren bir YAML dosyasının yolu (--assumptions). Boş: yok."
  - id: set.profiles
    en: "Folder of mapping profiles"
    tr: "Eşleme profilleri klasörü"
  - id: set.profiles_hint
    en: "Confirmed mappings are saved here and read from here, as the command line does (--profiles). This is the one place besides the output folder where the page writes."
    tr: "Onaylanan eşlemeler komut satırındaki gibi buraya kaydedilir ve buradan okunur (--profiles). Sayfanın çıktı klasörü dışında yazdığı tek yer burasıdır."
  - id: opt.basis.gross
    en: "Gross"
    tr: "Brüt"
  - id: opt.basis.ceded
    en: "Ceded"
    tr: "Devredilen"
  - id: opt.basis.net
