    tr: "Yarıyıl"
  - id: opt.period.year
    en: "Year"
    tr: "Yıl"
  - id: opt.view.reporting
    en: "Reporting"
    tr: "Raporlama"
  - id: opt.view.original
    en: "Original"
    tr: "Orijinal"

