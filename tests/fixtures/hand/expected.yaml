name: hand
status: hand_computed
checked_by_owner: false
description: 4x4 arithmetic fixtures for chain ladder, Bornhuetter-Ferguson and Cape Cod. Values are chosen
  for easy hand arithmetic, not calibrated to a real portfolio.
conventions:
- Cumulative amounts; annual origins; ages in months.
- Volume-weighted age-to-age factors; tail factor 1.0.
- Percent developed = 1 / cumulative development factor.
- Bornhuetter-Ferguson ultimate = latest + prior loss ratio x premium x (1 - percent developed).
- Cape Cod loss ratio = sum of latest / sum of (premium x percent developed); ultimate = latest + loss
  ratio x premium x (1 - percent developed). No decay, no trend.
- Derivation text shows intermediate numbers to 6 significant digits; 'value' keeps full precision.
