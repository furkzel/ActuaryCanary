source:
  package: chainladder
  version: 0.10.1
  calls:
  - tri = chainladder.load_sample('raa')
  - dev = chainladder.Development(average='volume', sigma_interpolation='mack').fit_transform(tri)
  - mack = chainladder.MackChainladder().fit(dev)
  notes:
  - Volume-weighted age-to-age factors; no tail (tail factor 1.0).
  - sigma_interpolation='mack' extrapolates the last sigma as in Mack (1993).
  - Mack standard error of the first origin is 0 (fully developed).
