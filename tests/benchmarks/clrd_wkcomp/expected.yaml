name: clrd_wkcomp
status: reference_implementation
checked_by_owner: false
published_figures: 'UNVERIFIED: no published source was opened for this file'
source:
  package: chainladder
  version: 0.10.1
  data: CAS Loss Reserving Database (Meyers and Shi 2011), workers compensation, sum over all companies;
    cumulative paid losses and net earned premium
  calls:
  - clrd = chainladder.load_sample('clrd')
  - t = clrd.groupby('LOB').sum().loc['wkcomp']
  - X = t['CumPaidLoss']; P = t['EarnedPremNet'].latest_diagonal
  - dev = chainladder.Development(average='volume', sigma_interpolation='mack').fit_transform(X)
  - mack = chainladder.MackChainladder().fit(dev)
  - bf = chainladder.BornhuetterFerguson(apriori=0.65).fit(dev, sample_weight=P)
  - cc = chainladder.CapeCod(trend=0, decay=1).fit(dev, sample_weight=P)
  notes:
  - Volume-weighted age-to-age factors; no tail (tail factor 1.0).
  - sigma_interpolation='mack' extrapolates the last sigma as in Mack (1993).
  - 'Cape Cod with no trend and no decay: one expected loss ratio for all origins.'
