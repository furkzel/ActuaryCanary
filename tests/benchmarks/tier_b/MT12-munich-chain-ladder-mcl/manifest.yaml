produced_on: '2026-10-24'
id: MT12-munich-chain-ladder-mcl
spec_ids:
- MT12
kind: library_reference
title: Munich chain ladder on the Quarg-Mack sample triangles
source:
  tool: chainladder
  version: 0.10.1
  data: chainladder.load_sample('mcl'), columns paid and incurred
  calls:
  - sample = chainladder.load_sample('mcl')
  - dev = chainladder.Development(average='volume', sigma_interpolation='mack').fit_transform(sample)
  - mcl = chainladder.MunichAdjustment(paid_to_incurred=[('paid', 'incurred')])
  - ultimate = chainladder.Chainladder().fit(mcl.fit_transform(dev)).ultimate_
how_produced: Run tests/benchmarks/tools/freeze_chainladder.py; values.csv holds the package output unchanged.
files:
  paid: paid.csv
  incurred: incurred.csv
  values: values.csv
tolerance_note: 1e-6 relative (spec MT12 benchmark).
information:
- quantity: lambda_all_links
  key: paid
  value: 0.6129837617419834
  note: 'dropped variant (decision 0607): every link with both residuals; derived by numpy'
- quantity: lambda_all_links
  key: incurred
  value: 0.42079527712292153
  note: dropped variant (decision 0607), as above
notes:
- Seven accident years, seven ages (12 to 84 months); tail factor 1.0.
- The lambda regressions leave the last link (one origin, extrapolated variance parameters) out, as the
  package does (decisions 0274 and 0607). The lambdas with every link (paid 0.6130, incurred 0.4208) are
  information only, see `information`.
- 'Published figures of Quarg and Mack (2004) were not opened: UNVERIFIED.'
checked_by_owner: false
