produced_on: '2026-10-24'
id: MT14-tail-curves-genins
spec_ids:
- MT14
kind: library_reference
title: Exponential decay and inverse power tails on genins
source:
  tool: chainladder
  version: 0.10.1
  data: chainladder.load_sample('genins')
  calls:
  - tri = chainladder.load_sample('genins')
  - dev = chainladder.Development(average='volume').fit_transform(tri)
  - chainladder.TailCurve(curve='exponential', extrap_periods=100).fit(dev)
  - chainladder.TailCurve(curve='inverse_power', extrap_periods=100).fit(dev)
how_produced: Run tests/benchmarks/tools/freeze_chainladder.py; the fit rows are checked against a numpy
  straight-line fit.
files:
  triangle: triangle.csv
  values: values.csv
tolerance_note: 1e-6 relative (spec MT14 benchmark).
notes:
- x is the link number (1 for 12-24 months, annual grain), which is the age at the start of the link in
  years (spec MT14, CV04).
- The package multiplies 100 extension periods; the spec stops when f - 1 falls below 1e-4. Both tails
  are frozen; for the inverse power curve they differ (decision 0276).
checked_by_owner: false
