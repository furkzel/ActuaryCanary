produced_on: '2026-10-25'
id: MT11-odp-bootstrap-raa
spec_ids:
- MT11
kind: library_reference
title: Over-dispersed Poisson bootstrap on raa
source:
  tool: chainladder
  version: 0.10.1
  data: chainladder.load_sample('raa')
  calls:
  - tri = chainladder.load_sample('raa')
  - sims = chainladder.BootstrapODPSample(n_sims=10000, hat_adj=False, random_state=42).fit_transform(tri)
  - each simulated increment X* replaced by mu + sqrt(n / (n - p)) (X* - mu)
  - chainladder.Chainladder().fit(one) for each adjusted pseudo-triangle alone
how_produced: 'Run tests/benchmarks/tools/freeze_chainladder.py odp raa. Deterministic rows are computed
  with numpy from the spec formulas and agree with the package scale_ to 1e-9. Simulation rows: the package
  resamples the residuals; the script applies the spec''s degrees-of-freedom adjustment sqrt(n / (n -
  p)) on top of the package output, fits the package''s chain ladder on each adjusted pseudo-triangle
  alone and adds gamma process error (mean m, variance phi m, sign kept) with numpy default_rng(seed).
  The adjustment is the spec''s, applied by this script: the simulation rows are not independent of the
  spec (decision 0282).'
seed: 42
n_simulations: 10000
files:
  triangle: triangle.csv
  residuals: residuals.csv
  values: values.csv
tolerance_note: 'Deterministic rows 1e-9 relative. Simulation rows are information; their rel_tol is the
  Monte Carlo spread of the statistic: three times its relative standard deviation over 30 other seeds
  of the same size, with a numpy refit that equals the package fitted on each pseudo-triangle alone (checked
  to 1e-9 on the seed of the frozen rows).'
notes:
- With hat_adj=False the package resamples the unscaled residuals (centred, the zero residuals of the
  two cells fitted exactly dropped); it does not apply the spec's degrees-of-freedom adjustment sqrt(n/(n-p)),
  which this script applies on top (decision 0282). The former reference (2026-10-24) said otherwise and
  was wrong.
- chainladder 0.10.1 fitted on all simulated triangles as one batch gives other reserves than fitted on
  each alone (it mixes the simulations), which widened the former reference; each pseudo-triangle is now
  fitted alone (decision 0282).
- 'Pass criteria of MT11 1.1.0: the scale parameter phi against deterministic scale_parameter_phi, and
  the mean of the simulated total reserve within 5 per cent of the chain-ladder reserve. Percentile and
  standard-deviation rows are information, not pass criteria (decision 0282).'
- 'Published scale parameter of GenIns (England and Verrall) not opened: UNVERIFIED.'
checked_by_owner: false
