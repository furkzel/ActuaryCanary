produced_on: '2026-10-24'
id: MT13-benktander-raa
spec_ids:
- MT13
kind: library_reference
title: Benktander blends on raa with a constant prior
source:
  tool: chainladder
  version: 0.10.1
  data: chainladder.load_sample('raa')
  calls:
  - tri = chainladder.load_sample('raa')
  - dev = chainladder.Development(average='volume').fit_transform(tri)
  - premium = tri.latest_diagonal * 0 + 30000
  - chainladder.Benktander(apriori=0.8, n_iters=2).fit(dev, sample_weight=premium)
  - chainladder.BornhuetterFerguson(apriori=0.8).fit(dev, sample_weight=premium)
how_produced: Run tests/benchmarks/tools/freeze_chainladder.py. Package ultimates (checked against the
  spec formulas).
prior:
  earned_premium_each_origin: 30000.0
  prior_loss_ratio: 0.8
files:
  triangle: triangle.csv
  premium: premium.csv
  values: values.csv
tolerance_note: 1e-9 relative (spec MT13 benchmark). Tail factor 1.0.
notes:
- The package counts n_iters = 1 as Bornhuetter-Ferguson; the spec's k is n_iters - 1 (k = 1 is the classical
  Benktander, package n_iters = 2).
- The samples carry no premium; premium and prior loss ratio are chosen for the test and are not market
  figures.
checked_by_owner: true
