produced_on: '2026-10-24'
id: MT14-tail-curves-raa
spec_ids:
- MT14
kind: library_reference
title: Exponential decay and inverse power tails on raa
source:
  tool: chainladder
  version: 0.10.1
  data: chainladder.load_sample('raa')
  calls:
  - tri = chainladder.load_sample('raa')
  - dev = chainladder.Development(average='volume').fit_transform(tri)
  - chainladder.TailCurve(curve='exponential', extrap_periods=100).fit(dev)
  - chainladder.TailCurve(curve='inverse_power', extrap_periods=100).fit(dev)
how_produced: Run tests/benchmarks/tools/freeze_chainladder.py; the fit rows are checked against a numpy
  straight-line fit.
files:
  triangle: triangle.csv
  values: values.csv
tolerance_note: 1e-6 relative (spec MT14 benchmark).
information:
- quantity: exponential_tail
  key: stop_below_1e-4
  value: 1.009222120897068
  note: 'dropped variant (decision 0608): extension stops when f - 1 < 1e-4, 6 periods; derived from a
    and b'
- quantity: inverse_power_tail
  key: stop_below_1e-4
  value: 1.0991432818557134
  note: 'dropped variant (decision 0608): extension stops when f - 1 < 1e-4, 68 periods; derived from
    a and b'
- quantity: inverse_power_tail
  key: infinite_product
  value: 1.1053405177306543
  note: 'information, not tested (decision 0614): the product run to 1e6 periods or until the increment is
    below 1e-12; the remainder beyond the 100 periods of the default is 0.35 per cent of the 100-period tail'
notes:
- x is the link number (1 for 12-24 months, annual grain), which is the age at the start of the link in
  years (spec MT14, CV04).
- The extension runs to a fixed number of development periods, default 100, as in the package (decisions
  0276 and 0608). The tail with the old stopping rule (f - 1 below 1e-4) is information only, see `information`. The fixed 100 periods also leave out the rest of the product (the inverse power tail with the infinite product is information, decision 0614).
checked_by_owner: true
