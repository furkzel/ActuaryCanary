# Same insurer as the baseline, delivered the way real files arrive: headers renamed, misspelt
# and in Turkish, title rows above the header, dates partly as text, labels as local aliases,
# repeated rows and personal-data columns. The data underneath is identical in meaning to the
# baseline's; truth/ says how each header, label and date was changed.
extends: baseline

messiness:
  headers: {style: aliases, canonical_share: 0.15, misspell_share: 0.2}
  title_rows: {min: 1, max: 3}
  date_formats: {text_share: 0.35}
  value_labels: {translate_share: 0.7}
  exact_duplicate_share: 0.01
  personal_data: true
