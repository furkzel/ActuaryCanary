# ActuaryCanary — true-world parameters for the synthetic baseline scenario.
#
# The generator simulates an insurer from these parameters. Because the parameters
# are known, the realised "truth" (ultimates, patterns, injected faults) is known too,
# and every method can be tested against it.
#
# All values are illustrative inputs for simulation. They are not market statistics,
# official inflation figures or any company's data.
#
# Units: money in TRY at the base date unless a currency is named; rates per year;
# delays in days; probabilities between 0 and 1.

meta:
  scenario: baseline
  version: 1
  seed: 20261013
  base_date: 2016-01-01                # money parameters are expressed at this date's prices
  accident_period: {start: 2016-01-01, end: 2025-12-31}
  valuation:
    first: 2016-01-31
    last: 2025-12-31
    frequency: month_end               # one cumulative snapshot per claim per month end
  reporting_currency: TRY

entities:                               # generic names, no real companies
  - {id: ENT_A, name: "Alpha Sigorta", segments: [NON_LIFE]}
  - {id: ENT_B, name: "Beta Sigorta",  segments: [NON_LIFE]}
  - {id: ENT_C, name: "Gamma Hayat",   segments: [LIFE]}

partners:                               # share of new policies sold through each channel
  - {id: AGENCY_NET, channel: AGENCY, share: 0.45}
  - {id: BROKER_ONE, channel: BROKER, share: 0.20}
  - {id: BANK_PARTNER, channel: BANK, share: 0.25}
  - {id: DIRECT_WEB, channel: DIRECT, share: 0.10}

# Market series. Inflation is an illustrative path, not official statistics.
market:
  cpi:
    series_id: CPI_TR
    base_value: 100.0                   # at base_date
    annual_rate_by_year: {2016: 0.08, 2017: 0.11, 2018: 0.20, 2019: 0.12, 2020: 0.14,
                          2021: 0.36, 2022: 0.64, 2023: 0.65, 2024: 0.45, 2025: 0.33}
    monthly_noise_sd: 0.004            # added to the smooth monthly rate
  fx:
    - {series_id: USD/TRY, start: 2.95, drift: inflation_differential, foreign_inflation: 0.03, monthly_vol: 0.035}
    - {series_id: EUR/TRY, start: 3.25, drift: inflation_differential, foreign_inflation: 0.02, monthly_vol: 0.035}
  fx_kinds_written: [FX_SPOT, FX_PERIOD_AVERAGE, FX_PERIOD_END]

# Claims inflation per line = CPI + superimposed inflation (per year).
lines:
  MOTOR_OD:                             # motor own damage (kasko)
    segment: NON_LIFE
    entities: [ENT_A, ENT_B]
    portfolio:
      policies_first_year: 40000
      growth_per_year: 0.04
      term_months: 12
      foreign_currency_share: 0.0
      sum_insured: {dist: lognormal, median: 250000, sigma: 0.5}
      cancellation_probability: 0.08
    premium:
      rate_on_sum_insured: 0.030
      indexed_to: CPI_TR                # premium per policy moves with inflation
      instalments: {probability: 0.6, count: 4}
      commission_rate: 0.15
    frequency: {per_exposure_year: 0.22, trend_per_year: 0.0}
    severity:
      body: {dist: lognormal, median: 12000, sigma: 1.0}
      tail: {probability: 0.002, dist: pareto, threshold: 300000, alpha: 2.2}
      superimposed_inflation: 0.03
    reporting_delay_days: {dist: lognormal, median: 5, sigma: 1.0}
    settlement_delay_days: {dist: lognormal, median: 60, sigma: 0.9}
    payments: {count: {dist: poisson, mean: 1.3, min: 1}}
    case_reserve:
      initial_bias: 0.05                # first estimate = true remaining cost × (1 + bias) × noise
      noise_sigma: 0.25
      review_every_months: 3
    nil_close_probability: 0.10
    reopen_probability: 0.02
    recoveries:
      subrogation: {probability: 0.15, recovered_share: 0.5, delay_days: {dist: lognormal, median: 180, sigma: 0.6}}
      salvage:     {probability: 0.05, recovered_share: 0.3, delay_days: {dist: lognormal, median: 90, sigma: 0.5}}
    allocated_expense_share: 0.03

  MOTOR_TPL:                            # motor third-party liability (trafik)
    segment: NON_LIFE
    entities: [ENT_A, ENT_B]
    portfolio:
      policies_first_year: 120000
      growth_per_year: 0.03
      term_months: 12
      foreign_currency_share: 0.0
      sum_insured: {dist: fixed, value: 0}
      cancellation_probability: 0.05
    premium:
      per_policy: 600
      indexed_to: CPI_TR
      instalments: {probability: 0.3, count: 2}
      commission_rate: 0.10
    frequency: {per_exposure_year: 0.05, trend_per_year: 0.0}
    severity:
      body: {dist: lognormal, median: 15000, sigma: 1.3}
      tail: {probability: 0.01, dist: pareto, threshold: 500000, alpha: 1.8}
      superimposed_inflation: 0.05
    reporting_delay_days: {dist: lognormal, median: 20, sigma: 1.4}
    settlement_delay_days: {dist: lognormal, median: 400, sigma: 1.0}
    payments: {count: {dist: poisson, mean: 2.0, min: 1}}
    case_reserve: {initial_bias: -0.10, noise_sigma: 0.35, review_every_months: 6}
    nil_close_probability: 0.15
    reopen_probability: 0.04
    litigation: {probability: 0.08, severity_multiplier: 2.5, settlement_delay_multiplier: 2.0}
    recoveries:
      subrogation: {probability: 0.05, recovered_share: 0.4, delay_days: {dist: lognormal, median: 365, sigma: 0.6}}
    allocated_expense_share: 0.06

  PROPERTY:                             # fire and allied perils (yangın)
    segment: NON_LIFE
    entities: [ENT_A]
    portfolio:
      policies_first_year: 25000
      growth_per_year: 0.05
      term_months: 12
      foreign_currency_share: 0.08      # policies written in USD or EUR
      foreign_currencies: {USD: 0.7, EUR: 0.3}
      sum_insured: {dist: lognormal, median: 1500000, sigma: 1.0}
      cancellation_probability: 0.04
    premium:
      rate_on_sum_insured: 0.0015
      indexed_to: CPI_TR
      instalments: {probability: 0.4, count: 4}
      commission_rate: 0.20
    frequency: {per_exposure_year: 0.03, trend_per_year: 0.0}
    severity:
      body: {dist: gamma, mean: 40000, cv: 1.5}
      tail: {probability: 0.01, dist: pareto, threshold: 1000000, alpha: 1.5}
      superimposed_inflation: 0.02
      capped_at_sum_insured: true
    reporting_delay_days: {dist: lognormal, median: 10, sigma: 1.0}
    settlement_delay_days: {dist: lognormal, median: 150, sigma: 1.0}
    payments: {count: {dist: poisson, mean: 1.8, min: 1}}
    case_reserve: {initial_bias: 0.10, noise_sigma: 0.40, review_every_months: 3}
    nil_close_probability: 0.12
    reopen_probability: 0.02
    recoveries:
      salvage: {probability: 0.08, recovered_share: 0.15, delay_days: {dist: lognormal, median: 120, sigma: 0.5}}
    catastrophe_events:
      - {event_code: CAT_2019_FLOOD, date: 2019-07-15, claims: 300, severity_multiplier: 1.8}
      - {event_code: CAT_2023_QUAKE, date: 2023-02-06, claims: 900, severity_multiplier: 3.0}
    allocated_expense_share: 0.04

  GROUP_TERM_LIFE:                      # group term life, death claims only
    segment: LIFE
    entities: [ENT_C]
    portfolio:
      policies_first_year: 8000
      growth_per_year: 0.06
      term_months: 12
      foreign_currency_share: 0.0
      sum_insured: {dist: lognormal, median: 300000, sigma: 0.6}
      cancellation_probability: 0.03
    premium:
      rate_on_sum_insured: 0.0025
      indexed_to: CPI_TR
      instalments: {probability: 0.8, count: 12}
      commission_rate: 0.08
    frequency: {per_exposure_year: 0.0015, trend_per_year: 0.0}
    severity:
      body: {dist: fixed_share_of_sum_insured, share: 1.0}
      superimposed_inflation: 0.0
    reporting_delay_days: {dist: lognormal, median: 30, sigma: 0.8}
    settlement_delay_days: {dist: lognormal, median: 45, sigma: 0.6}
    payments: {count: {dist: fixed, value: 1}}
    case_reserve: {initial_bias: 0.0, noise_sigma: 0.0, review_every_months: 12}
    nil_close_probability: 0.03
    reopen_probability: 0.0
    allocated_expense_share: 0.01

reinsurance:
  - {treaty_id: QS_PROPERTY, type: QUOTA_SHARE, lines: [PROPERTY], cession: 0.30, commission: 0.25,
     inception: 2016-01-01, renewal: annual}
  - {treaty_id: XL_TPL, type: EXCESS_OF_LOSS, lines: [MOTOR_TPL], retention: 2000000, limit: 8000000,
     retention_indexed_to: CPI_TR, rate_on_gross_premium: 0.02, inception: 2016-01-01, renewal: annual}
  - {treaty_id: XL_PROPERTY_CAT, type: EXCESS_OF_LOSS, lines: [PROPERTY], basis: event, retention: 20000000,
     limit: 200000000, retention_indexed_to: CPI_TR, rate_on_gross_premium: 0.05, inception: 2016-01-01, renewal: annual}

expenses:                               # per line, share of earned premium, booked monthly
  administration_share: {MOTOR_OD: 0.08, MOTOR_TPL: 0.07, PROPERTY: 0.09, GROUP_TERM_LIFE: 0.06}
  unallocated_claims_handling_share_of_paid: 0.03

# A deliberate change the methods should detect (used by the baseline only through truth;
# the reserve_bias_change scenario makes it larger).
reserving_practice_changes:
  - {line: MOTOR_TPL, from: 2022-01-01, initial_bias: 0.15}   # case reserves strengthened

# Faults injected into the data, so the quality report and anomaly flags can be scored.
injected_faults:
  duplicate_valuation_rows: 25
  report_before_occurrence: 15
  paid_to_date_decreasing_without_recovery: 10
  extreme_payment_outliers: 8          # single payments 20-50 times the line median
  missing_currency: 12
  unknown_status_labels: 5

# Columns that look like personal data, added to test that they are dropped on load.
personal_data_columns:
  - {name: SIGORTALI_ADI, kind: name}
  - {name: TCKN, kind: national_id_11_digits}
  - {name: MUSTERI_NO, kind: customer_number}

sizes:                                  # scale knob; tiny keeps the same structure
  tiny:   {portfolio_scale: 0.004, years: [2021, 2025]}   # under 2,000 valuation rows target
  medium: {portfolio_scale: 0.1}
  large:  {portfolio_scale: 1.0}

# What the generator must write as realised truth, per scenario and size.
outputs:
  - true_ultimate_by: [segment, line, entity, accident_year]   # gross, ceded, net; nominal and at base-date prices
  - true_ibnr_by: [segment, line, accident_year, valuation_date]
  - true_development_pattern: [line]                           # paid and incurred, yearly lags
  - true_inflation_path: [CPI_TR]
  - true_frequency_and_mean_severity: [line, accident_year]
  - injected_fault_list: [fault_type, file, row]
  - personal_data_column_list: true
